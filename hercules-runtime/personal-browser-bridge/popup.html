<!doctype html><meta charset="utf-8"><title>Hercules Personal Browser Bridge</title>
<style>body{font:14px system-ui;width:330px;padding:14px;background:#101010;color:#fff}input,button{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:9px;border:1px solid #444}button{font-weight:700}.muted{color:#aaa}#status{white-space:pre-wrap;margin-top:10px}</style>
<h3>Hercules Personal Browser</h3>
<p class="muted">Share only the current site. Passwords, cookies, OTP/MFA and CAPTCHA are never exported.</p>
<input id="pair" type="password" autocomplete="off" placeholder="One-time pairing token">
<button id="share">Share current tab</button>
<button id="disconnect">Disconnect</button>
<div id="status"></div>
<script src="popup.js"></script>

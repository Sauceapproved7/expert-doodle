apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopify-webhook
  namespace: commerce-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: shopify-webhook
  namespace: commerce-prod
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: shopify-webhook-tls
spec:
  selector:
    app.kubernetes.io/name: shopify-webhook
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopify-webhook
  namespace: commerce-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: shopify-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopify-webhook
    spec:
      serviceAccountName: shopify-webhook
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: node:22.12.0-alpine
          imagePullPolicy: IfNotPresent
          command: ["node","/app/server.mjs"]
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: PORT
              value: "8443"
            - name: TLS_CERT_PATH
              value: /var/run/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /var/run/tls/tls.key
            - name: SHOPIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopify-webhook-secrets
                  key: client-secret
            - name: SHOPIFY_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shopify-webhook-secrets
                  key: ingest-token
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopify-webhook-endpoint
                  key: url
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: shopify-webhook-endpoint
                  key: anon-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 20
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tls
              mountPath: /var/run/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: shopify-webhook-code
        - name: tls
          secret:
            secretName: shopify-webhook-tls
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shopify-webhook
  namespace: commerce-prod
  annotations:
    haproxy.router.openshift.io/timeout: 10s
spec:
  host: webhooks.sauceapproved.com
  path: /webhooks/shopify
  to:
    kind: Service
    name: shopify-webhook
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopify-webhook-isolation
  namespace: commerce-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shopify-webhook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

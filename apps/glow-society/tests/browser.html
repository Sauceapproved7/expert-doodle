<!doctype html><html lang="en"><meta charset="utf-8"><title>Glow Society browser QA</title>
<h1>Glow Society independent browser interaction QA</h1><pre id="result" data-status="running">Running real Chromium DOM checks...</pre>
<iframe id="app" src="../index.html#discover" title="App under test" width="390" height="840" style="border:1px solid #ddd"></iframe>
<script>
const output=document.getElementById('result');
const iframe=document.getElementById('app');
const steps=[];
const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
function assert(value,message){if(!value)throw Error(message);steps.push('PASS '+message)}
function click(element,message){assert(Boolean(element),'Control exists: '+message);element.click();}
function active(document,id){return document.querySelector('#'+id+'.view.active')!==null}
function count(document,selector){return document.querySelectorAll(selector).length}
function go(document,name){click(document.querySelector('[data-go="'+name+'"]'),'Navigate to '+name)}
async function check(document) {
 assert(active(document,'discover'),'Home initially active');
 assert(count(document,'#trendingGrid .product-card')===8,'Eight illustrated trending looks rendered');
 go(document,'explore');
 assert(active(document,'explore'),'Explore tab works');
 assert(count(document,'#exploreGrid .product-card')===47,'Catalog renders 47 inclusive demo looks');
 const catalog=document.getElementById('catalogWorkshop');
 assert(Boolean(catalog),'Read-only supplier intake workshop exists separately from demo items');
 assert(catalog.open===false,'Supplier review does not crowd the default exploration view');
 catalog.open=true;
 assert(document.getElementById('catalogIntakeStatus').textContent.includes('Approved: 0'),'No supplier record begins approved');
 click(document.getElementById('catalogSample'),'Run fictional sample review');
 assert(count(document,'#catalogIntakeResults .catalog-review-item')===2,'Two fictional supplier records are structurally reviewed');
 assert(count(document,'#catalogIntakeResults select[data-supplier-requirement]')===10,'Five independent proof requirements per candidate');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('10 missing evidence items'),'Every review evidence item initially missing');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('Request missing supplier evidence'),'Missing evidence produces actionable but non-authorizing guidance');
 assert(!document.getElementById('supplierReviewExport').disabled,'Unverified candidates can produce a preparation packet');
 const firstProof=document.querySelector('#catalogIntakeResults select[data-supplier-requirement="resale_rights"]');
 firstProof.value='claimed_unverified';
 firstProof.dispatchEvent(new Event('change',{bubbles:true}));
 assert(document.getElementById('supplierReviewStatus').textContent.includes('1 claimed evidence item'),'Self-reported evidence status updates locally');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('9 missing evidence items'),'Claim updates missing evidence count without verifying proof');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('none independently verified'),'Coverage does not imply verification');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('Request missing supplier evidence'),'Partial claims still require missing documents');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('Approved: 0'),'Claimed evidence cannot authorize a sale');
 let packetFilename='',packetHref='';
 const localLinkPrototype=iframe.contentWindow.HTMLAnchorElement.prototype,originalPacketClick=localLinkPrototype.click;
 localLinkPrototype.click=function(){packetFilename=this.download;packetHref=this.href;};
 click(document.getElementById('supplierReviewExport'),'Download explicitly unverified supplier handoff');
 localLinkPrototype.click=originalPacketClick;
 assert(packetFilename==='glow-society-supplier-review-unverified.json','Export filename signals unverified evidence');
 assert(packetHref.startsWith('blob:'),'Packet uses local Blob download rather than service submission');
 const downloadedPacket=await iframe.contentWindow.fetch(packetHref).then(r=>r.json());
 assert(downloadedPacket.approved===0&&downloadedPacket.published===0&&!downloadedPacket.releaseEligible,'Export cannot be mistaken for product approval');
 assert(downloadedPacket.ownerApproval==='not_granted'&&downloadedPacket.independentVerification==='not_performed','Export requires external owner and verifier evidence');
 assert(downloadedPacket.records[0].requirements.resale_rights==='claimed_unverified','Export preserves only the unverified proof claim');
 click(document.getElementById('supplierReviewReset'),'Reset claimed supplier evidence');
 assert(firstProof.value==='not_provided','Reset restores not-provided evidence status');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('0 claimed evidence items'),'Reset removes the claimed evidence count');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('10 missing evidence items'),'Reset restores all missing proof requirements');

 assert(document.getElementById('catalogIntakeStatus').textContent.includes('Published: 0'),'Sample review cannot silently publish products');
 assert(count(document,'#catalogIntakeResults a')===0,'Unverified candidate source URLs are not active links');
 assert(count(document,'#exploreGrid .product-card')===47,'Supplier candidates never enter the 47 demo discoveries');
 assert(document.getElementById('catalogIntakeResults').textContent.includes('Not available for sale'),'Unverified supplier candidates remain blocked');
 const localKeysBeforeCatalog=[...Object.keys(iframe.contentWindow.localStorage)].sort().join('|');
 const candidateFeed={schemaVersion:1,products:[
    {sku:'REVIEW-01',brand:'Trial Concept Brand',name:'Unverified Hair Product',category:'hair',sourceUrl:'https://example.com/for-demo-only',tags:['4c','protective']},
    {sku:'REVIEW-02',brand:'Trial Concept Brand',name:'Unsafe Entry',category:'makeup',sourceUrl:'javascript:alert(1)',tags:['deep']}
 ]};
 const localFileInput=document.getElementById('catalogFile');
 const fileTransfer=new iframe.contentWindow.DataTransfer();
 fileTransfer.items.add(new iframe.contentWindow.File([JSON.stringify(candidateFeed)],'test-feed.json',{type:'application/json'}));
 localFileInput.files=fileTransfer.files;
 localFileInput.dispatchEvent(new Event('change',{bubbles:true}));
 await wait(80);
 assert(count(document,'#catalogIntakeResults .catalog-review-item')===1,'Only structurally valid local supplier candidates are previewed');
 assert(count(document,'#catalogIntakeResults select[data-supplier-requirement]')===5,'Rejected candidate cannot receive an evidence review checklist');
 assert(document.getElementById('supplierReviewStatus').textContent.includes('0 claimed evidence items'),'New upload cannot inherit old supplier review claims');

 assert(count(document,'#catalogIntakeResults .catalog-rejected')===1,'Unsafe local supplier URL is rejected');
 assert(document.getElementById('catalogIntakeStatus').textContent.includes('Approved: 0'),'Imported candidate cannot assert seller authority');
 assert([...Object.keys(iframe.contentWindow.localStorage)].sort().join('|')===localKeysBeforeCatalog,'Supplier feed is not written to browser storage');
 click(document.getElementById('catalogReset'),'Clear all supplier candidates');
 assert(count(document,'#catalogIntakeResults .catalog-review-item')===0,'Clearing the review removes supplier candidates from memory-backed UI');
 assert(document.getElementById('supplierReviewExport').disabled,'Clear review disables stale evidence packet exports');
 assert(document.getElementById('supplierReviewReset').disabled,'Clear review disables evidence changes');

 assert(document.getElementById('catalogFile').value==='','Clear resets selected local supplier file');

 const matchForm=document.getElementById('beautyMatchForm');
 assert(Boolean(matchForm),'Beauty Match choices can be selected without camera');
 document.getElementById('matchCategory').value='makeup';
 document.getElementById('matchDepth').value='deep';
 document.getElementById('matchTone').value='cool';
 matchForm.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
 assert(count(document,'#matchResults .product-card')>=2,'Deep-cool makeup choices return multiple illustrative looks');
 assert(document.getElementById('matchStatus').textContent.includes('not measured shade'),'Suggestions never claim measured color accuracy');
 assert(document.getElementById('matchResults').textContent.includes('deep-depth inspiration tag'),'Suggestion explains which depth label was used');
 document.getElementById('matchCategory').value='hair';
 document.getElementById('matchTexture').value='4c';
 matchForm.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
 assert(count(document,'#matchResults .product-card')>=1,'4C hair selection returns textured-style concepts');
 assert(document.getElementById('matchResults').textContent.includes('4C Crown Coils'),'4C crown style is discoverable in the match wizard');
 document.getElementById('matchCategory').value='makeup';
 document.getElementById('matchDepth').value='light';
 document.getElementById('matchTone').value='olive';
 matchForm.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
 assert(count(document,'#matchResults .product-card')===0,'Unmatched depth/undertone combination does not fabricate a match');
 click(document.getElementById('matchClear'),'Clear temporary match wizard selections');
 assert(count(document,'#matchResults .product-card')===0,'Clearing wizard removes prior suggestions');
 assert(document.getElementById('matchDepth').value==='all','Clearing wizard resets depth preference without touching Beauty Passport');

 const filter=document.getElementById('depthFilter');
 filter.value='deep';filter.dispatchEvent(new Event('change',{bubbles:true}));
 const deepCount=count(document,'#exploreGrid .product-card');
 assert(deepCount>0 && deepCount<47,'Deep-complexion filter narrows makeup while preserving hair/nail categories');
 const texture=document.getElementById('textureFilter');
 texture.value='4c';texture.dispatchEvent(new Event('change',{bubbles:true}));
 assert(count(document,'#exploreGrid .product-card')<deepCount,'4C texture discovery narrows hairstyle choices');
 texture.value='all';texture.dispatchEvent(new Event('change',{bubbles:true}));
 click(document.getElementById('savePassport'),'Save private Beauty Passport');
 assert(Boolean(iframe.contentWindow.localStorage.getItem('glow-society-v1-passport')),'Beauty Passport saved to local browser storage');
 click(document.getElementById('resetPassport'),'Reset private Beauty Passport');
 assert(iframe.contentWindow.localStorage.getItem('glow-society-v1-passport')==='null','Beauty Passport can be erased without an account');
 const search=document.getElementById('search');
 search.value='locs';search.dispatchEvent(new Event('input',{bubbles:true}));
 assert(count(document,'#exploreGrid .product-card')>=2,'Loc discovery returns textured hair looks');
 search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));
 filter.value='all';filter.dispatchEvent(new Event('change',{bubbles:true}));
 click(document.querySelector('#exploreGrid [data-fav]'),'Favorite a look');
 go(document,'saved');
 assert(active(document,'saved'),'Saved tab works');
 assert(count(document,'#savedGrid .product-card')>=1,'Favorite persisted to private lookbook');
 click(document.querySelector('#savedGrid [data-try]'),'Open selected look in Try On Studio');
 assert(active(document,'studio'),'Studio opens from lookbook');
 assert(Boolean(document.querySelector('#photoLab:not([hidden])')),'Manual photo mode initially available');
 const intensity=document.getElementById('intensity');
 intensity.value='85';intensity.dispatchEvent(new Event('input',{bubbles:true}));
 assert(document.getElementById('intensityNumber').textContent==='85%','Overlay intensity works');
 assert(document.getElementById('arHealthStatus').dataset.status==='unmeasured','AR metrics start as unmeasured rather than fabricated');
 assert(count(document,'#validationScenarios select[data-validation-id]')===6,'Six inclusive physical-device scenarios are rendered');
 assert([...document.querySelectorAll('#validationScenarios select')].every(input=>input.disabled),'Observation selectors are gated until actual matching camera samples exist');
 assert(document.getElementById('exportValidation').disabled,'Self-reported validation cannot export without observed camera samples');
 assert(document.getElementById('validationStatus').textContent.includes('No results are independently verified'),'Checklist does not claim real-world verification');
 click(document.getElementById('resetValidation'),'Reset unused observation checklist');
 assert(document.getElementById('exportValidation').disabled,'Reset checklist cannot invent completed observations');
 assert(document.getElementById('exportArHealth').disabled,'Cannot export unobserved landmark session statistics');
 assert(document.getElementById('arHealthStatus').textContent.includes('Not measured'),'AR panel makes non-observation explicit');
 const media=iframe.contentWindow.navigator.mediaDevices;
 assert(Boolean(media&&media.getUserMedia),'Browser provides camera API for controlled tests');
 const originalGetUserMedia=media.getUserMedia.bind(media);
 let videoTrackStopped=false;let microphoneRequested=false;
 media.getUserMedia=async constraints=>{
   microphoneRequested=Boolean(constraints.audio);
   const fakeTrack={readyState:'live',getSettings:()=>({width:640,height:480}),stop:()=>{videoTrackStopped=true;fakeTrack.readyState='ended';}};
   return {getVideoTracks:()=>[fakeTrack],getTracks:()=>[fakeTrack]};
 };
 click(document.getElementById('runCameraCheck'),'Start user-controlled mocked camera check');
 await wait(20);
 assert(document.getElementById('cameraCheckStatus').dataset.result==='passed','Permission-granted camera simulation reports correct readiness');
 assert(videoTrackStopped,'Temporary video stream tracks are stopped on success');
 assert(!microphoneRequested,'Camera check never requests audio');
 assert(document.getElementById('cameraCheckStatus').textContent.includes('does not verify face tracking'),'Camera test does not overclaim real-world AR quality');
 assert(!document.getElementById('runCameraCheck').disabled,'Camera test returns control after stopping stream');
 media.getUserMedia=async()=>{const denied=new Error('Permission denied');denied.name='NotAllowedError';throw denied;};
 click(document.getElementById('runCameraCheck'),'Simulate denied camera permission');
 await wait(20);
 assert(document.getElementById('cameraCheckStatus').dataset.result==='unavailable','Permission denial has a graceful fallback');
 assert(document.getElementById('cameraCheckStatus').textContent.includes('Photo Lab still works'),'Camera denial offers photo-mode alternative');
 // A camera compatibility request can resolve after the user leaves Studio.
 let finishCheck=null;
 let cancelledCheckTrackStopped=false;
 media.getUserMedia=()=>new Promise(resolve=>{finishCheck=resolve});
 click(document.getElementById('runCameraCheck'),'Start delayed camera compatibility check');
 assert(document.getElementById('runCameraCheck').disabled,'Repeated camera checks cannot overlap');
 click(document.querySelector('[data-mode="face"]'),'Navigate away from photo mode during pending permission');
 assert(document.getElementById('cameraCheckStatus').dataset.result==='cancelled','Navigating between camera modes cancels pending check');
 click(document.getElementById('startCamera'),'Attempt live camera while permission check pending');
 assert(document.getElementById('cameraStatus').textContent==='CAMERA OFF','Live session does not overlap a pending check');
 const cancelledCheckTrack={readyState:'live',stop(){cancelledCheckTrackStopped=true;this.readyState='ended';},getSettings:()=>({width:640,height:480})};
 finishCheck({getTracks:()=>[cancelledCheckTrack],getVideoTracks:()=>[cancelledCheckTrack]});
 await wait(20);
 assert(cancelledCheckTrackStopped,'Late camera compatibility grant is immediately stopped');
 assert(document.getElementById('cameraCheckStatus').dataset.result==='cancelled','Late permission must not overwrite cancelled status');

 // Live AR permission can also arrive only after leaving the Studio.
 let finishLive=null;
 let staleLiveTrackStopped=false;
 media.getUserMedia=()=>new Promise(resolve=>{finishLive=resolve});
 click(document.getElementById('startCamera'),'Start live face camera with delayed permission');
 assert(document.getElementById('cameraStatus').textContent==='LOADING','Delayed live session shows loading');
 click(document.querySelector('[data-mode="photo"]'),'Cancel live face mode before permission resolves');
 const staleLiveTrack={readyState:'live',stop(){staleLiveTrackStopped=true;this.readyState='ended';}};
 finishLive({getTracks:()=>[staleLiveTrack],getVideoTracks:()=>[staleLiveTrack]});
 await wait(20);
 assert(staleLiveTrackStopped,'Late live permission closes stream after navigation');
 assert(document.getElementById('cameraVideo').srcObject===null,'Cancelled camera session leaves no video stream attached');
 assert(document.getElementById('cameraStatus').textContent==='CAMERA OFF','Stale session cannot turn camera on');
 media.getUserMedia=originalGetUserMedia;
 click(document.querySelector('[data-mode="face"]'),'Choose live face mode without starting camera');
 assert(Boolean(document.querySelector('#cameraLab:not([hidden])')),'Face camera affordance shown');
 assert(document.getElementById('startCamera').hidden===false,'Camera is opt-in, not auto-started');
 click(document.querySelector('[data-mode="photo"]'),'Return to manual photo');
 click(document.getElementById('saveLook'),'Save a selected look');
 go(document,'saved');
 assert(count(document,'#looksGrid .look-card')>=1,'Saved look is shown');
 go(document,'community');
 assert(active(document,'community'),'Community demo tab works');
 const field=document.getElementById('postText');
 field.value='My test note stays in this browser.';
 field.dispatchEvent(new Event('input',{bubbles:true}));
 document.getElementById('postForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
 assert(document.getElementById('feed').textContent.includes('My test note stays in this browser.'),'Private post appears in local-only feed');
 click(document.querySelector('#feed [data-post="seed-1"] [data-hidepost]'),'Hide unwanted sample post locally');
 assert(!document.querySelector('#feed [data-post="seed-1"]'),'Hidden sample post disappears from this device');
 click(document.getElementById('restoreHidden'),'Restore hidden demo posts');
 assert(Boolean(document.querySelector('#feed [data-post="seed-1"]')),'Hidden post is restored');
 click(document.querySelector('#feed [data-post="seed-2"] [data-muteauthor]'),'Mute fictional creator locally');
 assert(!document.querySelector('#feed [data-post="seed-2"]'),'Muted demo creator disappears from private feed');
 assert(Boolean(document.querySelector('#feed [data-post="seed-3"]')),'Muting a creator does not remove other fictional profiles');
 click(document.getElementById('restoreMuted'),'Unmute fictional creators');
 assert(Boolean(document.querySelector('#feed [data-post="seed-2"]')),'Muting is reversible');
 go(document,'artists');
 assert(count(document,'#artistGrid .artist-card')===8,'Creator directory renders eight fictional artist profiles');
 go(document,'saved');
 assert(document.getElementById('privacySummary').textContent.includes('favorites'),'Local-data summary counts saved preferences');
 const local=iframe.contentWindow.localStorage;
 local.setItem('another-app-test-marker','keep');
 let downloadName='',downloadHref='';
 const aPrototype=iframe.contentWindow.HTMLAnchorElement.prototype;
 const savedClick=aPrototype.click;
 aPrototype.click=function(){downloadName=this.download;downloadHref=this.href;};
 click(document.getElementById('exportLocalData'),'Export private browser data');
 aPrototype.click=savedClick;
 assert(downloadName==='glow-society-private-data.json','Local export suggests a JSON file');
 assert(downloadHref.startsWith('blob:'),'Export is built locally as a Blob download, not a network submission');
 assert(local.getItem('another-app-test-marker')==='keep','Export does not alter other app storage');
 const savedKey=local.getItem('glow-society-v1-favs');
 click(document.getElementById('eraseLocalData'),'Open confirmed data-erasure panel');
 assert(!document.getElementById('eraseConfirm').hidden,'Erasure requires a separate confirmation');
 assert(local.getItem('glow-society-v1-favs')===savedKey,'Opening confirmation does not erase data');
 click(document.getElementById('cancelEraseLocalData'),'Cancel irreversible local erasure');
 assert(document.getElementById('eraseConfirm').hidden,'Erasure can be cancelled');
 assert(local.getItem('glow-society-v1-favs')===savedKey,'Cancelled erasure retains saved data');
 click(document.getElementById('eraseLocalData'),'Reopen erasure confirmation');
 click(document.getElementById('confirmEraseLocalData'),'Confirm Glow Society-only erasure');
 assert([...Object.keys(local)].every(k=>!k.startsWith('glow-society-v1-')),'All Glow Society keys are removed from local storage');
 assert(!document.getElementById('catalogIntakeResults').children.length,'Private-data erasure also clears transient candidate review');
 assert(document.getElementById('supplierReviewExport').disabled,'Private data erasure invalidates supplier review packet');
 assert(document.getElementById('matchDepth').value==='all'&&count(document,'#matchResults .product-card')===0,'Private-data erasure also resets any temporary Beauty Match choices');
 assert(local.getItem('another-app-test-marker')==='keep','Other origin storage remains untouched');
 assert(count(document,'#looksGrid .look-card')===0,'In-memory saved looks are cleared immediately');
 assert(count(document,'#savedGrid .product-card')===0,'In-memory favorites are cleared immediately');
 assert(document.getElementById('privacySummary').textContent.includes('0 favorites'),'Privacy summary reflects empty state');
 assert(document.getElementById('exportArHealth').disabled,'Erasure leaves no stale AR session export enabled');
 assert(document.getElementById('exportValidation').disabled,'Data erasure leaves no stale observation report enabled');
 assert([...document.querySelectorAll('#validationScenarios select')].every(input=>input.value==='not-tested'),'Data erasure resets local observation choices');
 go(document,'community');
 assert(!document.getElementById('feed').textContent.includes('My test note stays in this browser.'),'Private demo posts disappear after confirmed erasure');
 assert(document.querySelector('meta[name="robots"]').getAttribute('content').includes('noindex'),'Preview metadata discourages indexing');
 assert(Boolean(window.localStorage),'Browser local storage is available');
}
iframe.onload=async()=>{try{await wait(500);const doc=iframe.contentDocument;await check(doc);
 const local=iframe.contentWindow.localStorage;
 assert([...Object.keys(local)].every(k=>!k.startsWith('glow-society-v1-')),'Confirmed erase leaves no Glow Society demo keys');
 output.dataset.status='pass';output.textContent=steps.join('\n')+'\nALL '+steps.length+' BROWSER CHECKS PASSED';
 }catch(err){output.dataset.status='fail';output.textContent=steps.join('\n')+'\nFAIL '+(err.stack||err.message);}
};
</script></html>

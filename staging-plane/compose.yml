name: hercules-staging
services:
  postgres:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_DB: hercules_staging
      POSTGRES_USER: hercules_admin
      POSTGRES_PASSWORD: ${HERCULES_STAGING_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hercules_staging_pg:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./bin:/staging-bin:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hercules_admin -d hercules_staging"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [staging]

  migrate:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: ${HERCULES_STAGING_DB_PASSWORD}
      HERCULES_STAGING_API_PASSWORD: ${HERCULES_STAGING_API_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
      - ./bin:/staging-bin:ro
    entrypoint: ["/bin/sh", "/staging-bin/migrate.sh"]
    networks: [staging]

  postgrest:
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      PGRST_DB_URI: postgres://hercules_api:${HERCULES_STAGING_API_PASSWORD}@postgres:5432/hercules_staging
      PGRST_DB_SCHEMAS: staging_api
      PGRST_DB_ANON_ROLE: staging_anon
      PGRST_JWT_SECRET: ${HERCULES_STAGING_JWT_SECRET}
      PGRST_DB_CHANNEL_ENABLED: "false"
    networks: [staging]

  forge:
    image: node:22.12.0-alpine@sha256:51eff88af6dff26f59316b6e356188ffa2c422bd3c3b76f2556a2e7e89d080bd
    environment:
      FORGE_ROOT: /forge-state
      FORGE_CONTROL_TOKEN: ${HERCULES_FORGE_STAGING_CONTROL_TOKEN}
      FORGE_PUBLIC_ORIGIN: https://forge.staging.invalid
      FORGE_HOST: 0.0.0.0
      FORGE_PORT: "38700"
      FORGE_DATA_MAX_BYTES: "52428800"
      FORGE_LOGIN_MAX_FAILURES: "8"
      FORGE_LOGIN_WINDOW_MS: "300000"
    command: ["node", "/repo/hercules-forge/production-cli.mjs"]
    volumes:
      - ../hercules-forge:/repo/hercules-forge:ro
      - hercules_forge_state:/forge-state
    ports:
      - "127.0.0.1:38700:38700"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:38700/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [edge]

  api:
    image: node:22.12.0-alpine@sha256:51eff88af6dff26f59316b6e356188ffa2c422bd3c3b76f2556a2e7e89d080bd
    depends_on:
      postgrest: {condition: service_started}
    environment:
      PORT: "8080"
      POSTGREST_URL: http://postgrest:3000
      HERCULES_ENVIRONMENT: staging
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./api:/app:ro
    ports:
      - "127.0.0.1:38080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [staging, edge]

networks:
  staging:
    internal: true
  edge:

volumes:
  hercules_staging_pg:
  hercules_forge_state:

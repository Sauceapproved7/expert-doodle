name: hercules-staging
services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: hercules_staging
      POSTGRES_USER: hercules_admin
      POSTGRES_PASSWORD: ${HERCULES_STAGING_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hercules_staging_pg:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./bin:/staging-bin:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hercules_admin -d hercules_staging"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [staging]

  migrate:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: ${HERCULES_STAGING_DB_PASSWORD}
      HERCULES_STAGING_API_PASSWORD: ${HERCULES_STAGING_API_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
      - ./bin:/staging-bin:ro
    entrypoint: ["/bin/sh", "/staging-bin/migrate.sh"]
    networks: [staging]

  postgrest:
    image: postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      PGRST_DB_URI: postgres://hercules_api:${HERCULES_STAGING_API_PASSWORD}@postgres:5432/hercules_staging
      PGRST_DB_SCHEMAS: staging_api
      PGRST_DB_ANON_ROLE: staging_anon
      PGRST_JWT_SECRET: ${HERCULES_STAGING_JWT_SECRET}
      PGRST_DB_CHANNEL_ENABLED: "false"
    networks: [staging]

  base:
    image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    depends_on:
      postgrest: {condition: service_started}
    environment:
      HERCULES_BASE_CONTROL_TOKEN: ${HERCULES_BASE_CONTROL_TOKEN}
      HERCULES_BASE_HOST: 0.0.0.0
      HERCULES_BASE_PORT: "38800"
      HERCULES_BASE_POSTGREST_URL: http://postgrest:3000
      HERCULES_BASE_JWT_SECRET: ${HERCULES_STAGING_JWT_SECRET}
      HERCULES_BASE_FIXTURE_ONLY: "true"
      HERCULES_BASE_STORAGE_ROOT: /base-storage
    command: ["node", "/repo/hercules-base/server.mjs"]
    volumes:
      - ../hercules-base:/repo/hercules-base:ro
      - ../hercules-runtime:/repo/hercules-runtime:ro
      - hercules_base_storage:/base-storage
    ports:
      - "127.0.0.1:38800:38800"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:38800/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [staging, edge]

  forge:
    image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    environment:
      FORGE_ROOT: /forge-state
      FORGE_CONTROL_TOKEN: ${HERCULES_FORGE_STAGING_CONTROL_TOKEN}
      FORGE_PUBLIC_ORIGIN: https://forge.staging.invalid
      FORGE_HOST: 0.0.0.0
      FORGE_PORT: "38700"
      FORGE_DATA_MAX_BYTES: "52428800"
      FORGE_LOGIN_MAX_FAILURES: "8"
      FORGE_LOGIN_WINDOW_MS: "300000"
    command: ["node", "/repo/hercules-forge/production-cli.mjs"]
    volumes:
      - ../hercules-forge:/repo/hercules-forge:ro
      - ../hercules-runtime:/repo/hercules-runtime:ro
      - hercules_forge_state:/forge-state
    ports:
      - "127.0.0.1:38700:38700"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:38700/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [edge]

  api:
    image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    depends_on:
      postgrest: {condition: service_started}
    environment:
      PORT: "8080"
      POSTGREST_URL: http://postgrest:3000
      HERCULES_ENVIRONMENT: staging
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./api:/app:ro
    ports:
      - "127.0.0.1:38080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [staging, edge]

networks:
  staging:
    internal: true
  edge:

volumes:
  hercules_staging_pg:
  hercules_forge_state:
  hercules_base_storage:

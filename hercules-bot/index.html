<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smallz · Hercules Operator</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#090909;color:#f5f5f5}main{max-width:900px;margin:auto;padding:32px}h1{font-size:42px;margin:0 0 8px}.sub{color:#999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}.card{background:#151515;border:1px solid #292929;border-radius:16px;padding:20px}.status{font-size:24px}.safe{color:#7ee787}.danger{color:#ff6b6b}input{width:100%;box-sizing:border-box;padding:16px;background:#0d0d0d;color:white;border:1px solid #333;border-radius:10px;font-size:16px}button{padding:12px 16px;border:0;border-radius:10px;margin:8px 8px 0 0;font-weight:700;cursor:pointer}.primary{background:#fff;color:#000}.stop{background:#d33;color:#fff}.log{white-space:pre-wrap;background:#0d0d0d;padding:16px;border-radius:10px;min-height:120px;color:#bbb}</style></head>
<body><main><h1>SMALLZ</h1><div class="sub">Owner-authenticated Hercules operator · mutations require the external stop authority</div>
<section class="card"><div class="sub">OWNER SESSION</div><input id="email" type="email" autocomplete="email" placeholder="Owner email"><button class="primary" onclick="signin()">SEND SIGN-IN LINK</button><button onclick="signout()">SIGN OUT</button><div id="auth" class="sub">Loading owner authentication…</div></section>
<div class="grid"><section class="card"><div class="sub">LOCAL BODY</div><div id="body" class="status">Checking…</div><button class="stop" onclick="post('/api/estop')">EMERGENCY STOP</button><button onclick="post('/api/resume')">RESUME</button><div id="external" class="sub">External control: checking…</div></section>
<section class="card"><div class="sub">PENDING COMMAND</div><div id="pending" class="status">No pending command</div><button class="primary" onclick="post('/api/approve')">APPROVE</button></section></div>
<section class="card"><input id="cmd" placeholder="Talk to Smallz: e.g. inspect vault" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">SEND</button><div id="log" class="log"></div></section>
</main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const $=id=>document.getElementById(id);let sb=null,ownerSession=null;
try{const response=await fetch('/api/auth-config',{cache:'no-store'});if(!response.ok)throw new Error('Owner authentication is not configured');const cfg=await response.json();sb=createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});ownerSession=(await sb.auth.getSession()).data.session;sb.auth.onAuthStateChange((_event,session)=>{ownerSession=session;$('auth').textContent=session?'Signed in; owner identity is checked by the server.':'Not signed in';if(session)refresh()});$('auth').textContent=ownerSession?'Signed in; owner identity is checked by the server.':'Sign in to use operator controls.'}catch(error){$('auth').textContent=error.message}
async function signin(){if(!sb)return;const email=$('email').value.trim();if(!email)return;const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+'/app'}});$('auth').textContent=error?'Sign-in failed':'Check your email for the sign-in link.'}
async function signout(){if(sb)await sb.auth.signOut();ownerSession=null;$('auth').textContent='Not signed in'}
async function api(url,body){if(!ownerSession)throw new Error('Owner sign-in required');const headers={authorization:'Bearer '+ownerSession.access_token};if(body)headers['content-type']='application/json';const r=await fetch(url,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});const value=await r.json();if(!r.ok)throw new Error(value.error||value.reason||'Request denied');return value}
function log(value){$('log').textContent=value}
async function post(url){try{log(JSON.stringify(await api(url,{}),null,2))}catch(error){log(error.message)}await refresh()}
async function send(){const value=$('cmd').value.trim();if(!value)return;try{log(JSON.stringify(await api('/api/command',{text:value}),null,2));$('cmd').value=''}catch(error){log(error.message)}await refresh()}
async function refresh(){if(!ownerSession){$('body').textContent='LOCKED';$('external').textContent='External control: owner sign-in required';return}try{const state=await api('/api/state');$('body').textContent=state.body.connected?'CONNECTED':'DISCONNECTED';$('body').className='status '+(state.externalControl?.emergencyStopClear?'safe':'danger');$('external').textContent=state.externalControl?`External stop ${state.externalControl.emergencyStopClear?'clear':'active'} · identity ${state.externalControl.identityTrusted?'trusted':'untrusted'} · audit ${state.externalControl.auditTrusted?'trusted':'untrusted'}`:'External control unavailable';$('pending').textContent=state.pending?state.pending.command:'No pending command'}catch(error){$('body').textContent='LOCKED';$('body').className='status danger';$('external').textContent='External control unavailable; mutations remain denied';log(error.message)}}
window.signin=signin;window.signout=signout;window.post=post;window.send=send;refresh();setInterval(refresh,5000);
</script></body></html>

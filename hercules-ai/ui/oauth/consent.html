<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Authorize Hercules</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:system-ui,sans-serif;max-width:560px;margin:8vh auto;padding:24px;background:#0b0d10;color:#f5f7fa}
    main{border:1px solid #2b3138;border-radius:18px;padding:28px;background:#12161b}
    h1{margin-top:0}.muted{color:#aab4c0}.error{color:#ffb4b4}.hidden{display:none}
    input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:10px}
    input{background:#0b0d10;color:#fff;border:1px solid #39424d}
    button{border:0;font-weight:700;cursor:pointer}.approve{background:#fff;color:#111}.deny{background:#303741;color:#fff}
    ul{padding-left:20px}
  </style>
</head>
<body>
<main>
  <h1>Authorize Hercules</h1>
  <p id="status" class="muted">Loading authorization request…</p>
  <section id="signin" class="hidden">
    <p>Sign in to review this request.</p>
    <input id="email" type="email" autocomplete="username" placeholder="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="sign-in" class="approve">Sign in</button>
  </section>
  <section id="consent" class="hidden">
    <p><strong id="requesting-client">Requesting application</strong> wants access to Hercules.</p>
    <p class="muted">Requested permissions:</p>
    <ul id="requested-scopes"></ul>
    <button id="approve" class="approve">Approve</button>
    <button id="deny" class="deny">Deny</button>
  </section>
</main>
<script>
(() => {
  const SUPABASE_URL = "https://xbwuablxhhwsaoomsoco.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wB9FvOqAi-JhUQuJrHvczg_C_V4RgCt";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const authorizationId = new URLSearchParams(window.location.search).get("authorization_id");
  const status = document.getElementById("status");
  const signin = document.getElementById("signin");
  const consent = document.getElementById("consent");

  function fail(message) {
    status.textContent = message || "Invalid authorization request";
    status.className = "error";
    signin.classList.add("hidden");
    consent.classList.add("hidden");
  }

  async function loadRequest() {
    if (!authorizationId) {
      fail("Invalid authorization request");
      return;
    }
    const { data: sessionData } = await client.auth.getSession();
    if (!sessionData?.session) {
      status.textContent = "Authentication required.";
      signin.classList.remove("hidden");
      return;
    }
    const { data, error } = await client.auth.oauth.getAuthorizationDetails(authorizationId);
    if (error || !data) {
      fail(error?.message || "Invalid authorization request");
      return;
    }
    if (!("authorization_id" in data)) {
      if (data.redirect_url) window.location.replace(data.redirect_url);
      else fail("Invalid authorization request");
      return;
    }
    const name = data.client?.name || data.client_name || data.client_id || "OAuth client";
    document.getElementById("requesting-client").textContent = name;
    const scopes = String(data.scope || "").split(/\s+/).filter(Boolean);
    const list = document.getElementById("requested-scopes");
    list.replaceChildren(...scopes.map(scope => {
      const li = document.createElement("li");
      li.textContent = scope;
      return li;
    }));
    status.textContent = "Review this access request.";
    consent.classList.remove("hidden");
  }

  document.getElementById("sign-in").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) { fail(error.message); signin.classList.remove("hidden"); return; }
    signin.classList.add("hidden");
    await loadRequest();
  });

  async function decide(approved) {
    consent.classList.add("hidden");
    status.textContent = approved ? "Approving…" : "Denying…";
    const result = approved
      ? await client.auth.oauth.approveAuthorization(authorizationId)
      : await client.auth.oauth.denyAuthorization(authorizationId);
    if (result.error || !result.data?.redirect_url) {
      fail(result.error?.message || "Authorization decision failed");
      return;
    }
    window.location.replace(result.data.redirect_url);
  }

  document.getElementById("approve").addEventListener("click", () => decide(true));
  document.getElementById("deny").addEventListener("click", () => decide(false));
  loadRequest().catch(() => fail("Invalid authorization request"));
})();
</script>
</body>
</html>

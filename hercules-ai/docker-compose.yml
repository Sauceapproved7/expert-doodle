services:
  api:
    build: .
    container_name: hercules-ai
    restart: unless-stopped
    environment:
      HERCULES_MODEL_BASE_URL: http://ollama:11434
      HERCULES_DEFAULT_MODEL: qwen2.5:7b
      HERCULES_DB: /data/hercules.db
      HERCULES_VAULT_DB: /data/hercules-vault.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hercules-data:/data
    depends_on:
      - ollama
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  ollama:
    image: ollama/ollama:latest
    container_name: hercules-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
volumes:
  hercules-data:
  ollama-data:

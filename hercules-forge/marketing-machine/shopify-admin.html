<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SauceApproved Marketing Machine</title><style>body{margin:0;background:#080a0f;color:#f7f7f7;font:15px system-ui}main{max-width:1180px;margin:auto;padding:24px}.hero,.panel{padding:22px;border:1px solid #29303c;border-radius:18px;background:#10141d}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid #343c4b;background:#151b26;border-radius:999px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.card{border:1px solid #252c38;background:#111620;border-radius:16px;padding:16px;cursor:pointer}.card:hover{border-color:#59657a}.num{opacity:.55;font-size:11px}.desc{opacity:.72;min-height:42px}.panel{margin-top:18px}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><section class="hero"><div class="num">SAUCEAPPROVED / HERCULES</div><h1>THE MACHINE</h1><div class="row"><span class="pill">SHOPIFY: READ MODE</span><span class="pill">KILL SWITCH: ARMED</span><span class="pill">WRITES: APPROVAL GATED</span></div></section><section id="grid" class="grid"></section><section class="panel"><div class="num">ACTIVE SYSTEM</div><h2 id="title">THE MACHINE</h2><p id="cap">Select a system.</p><pre id="output">Ready.</pre></section></main><script type="module">import{MARKETING_SYSTEMS}from"./index.mjs";const g=document.querySelector("#grid"),t=document.querySelector("#title"),c=document.querySelector("#cap"),o=document.querySelector("#output");for(const s of MARKETING_SYSTEMS){const e=document.createElement("article");e.className="card";e.innerHTML=`<div class="num">SYSTEM ${String(s.order).padStart(2,"0")}</div><h3>${s.name}</h3><div class="desc">${s.capability}</div>`;e.onclick=()=>{t.textContent=s.name;c.textContent=s.capability;o.textContent=JSON.stringify({system:s.name,status:"ready",mode:s.name==="Kill Switch"?"armed":"observe",shopifyWrites:"approval-gated"},null,2)};g.appendChild(e)}</script></body></html>

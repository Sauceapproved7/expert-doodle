name: Hercules Prompt Intelligence Trace
on:
  pull_request:
    paths:
      - 'hercules-runtime/prompt-intelligence/**'
      - 'hercules-bot/prompt-trace-ingress.mjs'
      - 'hercules-bot/prompt-trace-emitter.mjs'
      - 'hercules-bot/app-server.mjs'
      - 'tests/hercules-prompt-intelligence-*.test.mjs'
      - 'supabase/migrations/*hercules_prompt_trace_replay*.sql'
      - 'supabase/migrations/*hercules_prompt_trace_emit_sequence*.sql'
      - 'supabase/migrations/*hercules_prompt_trace_replay_window*.sql'
      - 'tests/hercules-prompt-intelligence-replay-window-db.sql'
      - 'tests/hercules-prompt-intelligence-postgrest.test.mjs'
      - 'tests/smallz-chromium-trace-e2e.mjs'
      - 'tests/smallz-gateway-http-chromium-e2e.mjs'
      - 'tests/hercules-prompt-intelligence-issuer-alignment-db.sql'
      - 'supabase/migrations/*hercules_prompt_trace_issuer_alignment*.sql'
      - 'tests/hercules-prompt-intelligence-replay-db.sql'
      - 'tests/hercules-prompt-intelligence-emitter-db.sql'
      - 'tests/hercules-prompt-intelligence-invoker-db.sql'
      - 'supabase/migrations/*hercules_prompt_trace_invoker*.sql'
      - 'docs/HERCULES-PROMPT-INTELLIGENCE-TRACE-V1.md'
      - 'docs/HERCULES-PROMPT-INTELLIGENCE-SMALLZ-INGRESS-V1.md'
      - '.github/workflows/hercules-prompt-intelligence.yml'
  workflow_dispatch:
jobs:
  trace-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/hercules-prompt-intelligence-*.test.mjs tests/smallz-render-runtime.test.mjs tests/smallz-owner-session-bridge.test.mjs
      - run: node scripts/verify-hercules-execution-contract.mjs
      - run: node scripts/verify-owner-code-only.mjs
      - run: node scripts/security-baseline.mjs

  replay-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare disposable Supabase-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
      - name: Apply migration in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015120000_hercules_prompt_trace_replay_v1.sql
      - name: Verify database replay, rollback and restricted privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/hercules-prompt-intelligence-replay-db.sql
      - name: Apply trusted emission sequence migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015160000_hercules_prompt_trace_emit_sequence_v1.sql
      - name: Verify issue-counter rollback, privileges and monotonicity
        run: psql -v ON_ERROR_STOP=1 -f tests/hercules-prompt-intelligence-emitter-db.sql
      - name: Verify emitter RPC runs under real service-role permissions
        run: |
          psql -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT public.hercules_prompt_trace_reserve_sequence('service_test'); RESET ROLE;"
      - name: Verify two competing sequence issuers allocate distinct values
        run: |
          (psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_reserve_sequence('racing_issuer');" >/tmp/issue-one) &
          a=$!
          (psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_reserve_sequence('racing_issuer');" >/tmp/issue-two) &
          b=$!
          wait "$a"
          wait "$b"
          test "$(sort -n /tmp/issue-one /tmp/issue-two | tr '\n' ',')" = "1,2,"
      - name: Verify competing workers cannot claim same sequence
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT public.hercules_prompt_trace_claim_sequence('racing_agent', 1);" >/dev/null
          (psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_claim_sequence('racing_agent', 5);" > /tmp/replay-one) &
          a=$!
          (psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_claim_sequence('racing_agent', 5);" > /tmp/replay-two) &
          b=$!
          wait "$a"
          wait "$b"
          test "$(cat /tmp/replay-one /tmp/replay-two | grep -cx t)" -eq 1
          test "$(cat /tmp/replay-one /tmp/replay-two | grep -cx f)" -eq 1

      - name: Upgrade disposable replay claims to bounded out-of-order window
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015180000_hercules_prompt_trace_replay_window_v1.sql
      - name: Test bounded out-of-order trace claims against disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f tests/hercules-prompt-intelligence-replay-window-db.sql

      - name: Verify concurrent cross-process out-of-order claims are both accepted
        run: |
          (psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_claim_sequence('window_race', 102);" > /tmp/window-race-high) &
          a=$!
          (psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_claim_sequence('window_race', 101);" > /tmp/window-race-low) &
          b=$!
          wait "$a"
          wait "$b"
          test "$(cat /tmp/window-race-high /tmp/window-race-low | grep -cx t)" -eq 2
          test "$(psql -v ON_ERROR_STOP=1 -Atc "SELECT public.hercules_prompt_trace_claim_sequence('window_race', 101);")" = f

      - name: Apply least-privilege replay RPC migration in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015190000_hercules_prompt_trace_invoker_v1.sql
      - name: Verify replay RPC is invoker-scoped and service role can claim
        run: psql -v ON_ERROR_STOP=1 -f tests/hercules-prompt-intelligence-invoker-db.sql

      - name: Align issuer counters with durable replay history
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015200000_hercules_prompt_trace_issuer_alignment_v1.sql
      - name: Verify aligned issued sequences never reuse historical claims
        run: psql -v ON_ERROR_STOP=1 -f tests/hercules-prompt-intelligence-issuer-alignment-db.sql
      - name: Start pinned disposable PostgREST on the CI PostgreSQL service
        run: |
          docker run --detach --name hercules-disposable-postgrest --network host \
            -e PGRST_DB_URI="postgres://postgres:disposable_only@127.0.0.1:5432/postgres" \
            -e PGRST_DB_SCHEMAS="public" \
            -e PGRST_DB_ANON_ROLE="anon" \
            -e PGRST_SERVER_PORT="3019" \
            -e PGRST_JWT_SECRET="hercules_disposable_test_only_jwt_signing_secret_2026" \
            postgrest/postgrest@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3019/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs hercules-disposable-postgrest
          exit 1
      - name: Verify real PostgREST owner, role and signed trace boundaries
        env:
          HERCULES_DISPOSABLE_POSTGREST_URL: http://127.0.0.1:3019
          HERCULES_DISPOSABLE_JWT_SECRET: hercules_disposable_test_only_jwt_signing_secret_2026
        run: node --test tests/hercules-prompt-intelligence-postgrest.test.mjs
      - name: Stop disposable PostgREST
        if: always()
        run: docker rm -f hercules-disposable-postgrest || true

  chromium-trace-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned existing Smallz Chromium runtime
        run: npm install --prefix hercules-browser-gateway-v2 --ignore-scripts --no-audit --no-fund
      - name: Install isolated Chromium and OS dependencies
        run: node hercules-browser-gateway-v2/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test real Chromium with signed owner admission and negative cases
        run: node --test tests/smallz-chromium-trace-e2e.mjs
      - name: Test actual Smallz HTTP gateway with real Chromium, auth and SSRF denials
        run: node --test tests/smallz-gateway-http-chromium-e2e.mjs

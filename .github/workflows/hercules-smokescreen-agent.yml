name: Hercules SmokeScreen Sentinel

on:
  pull_request:
    paths:
      - "hercules-runtime/smokescreen-agent.mjs"
      - "hercules-runtime/command-surface.mjs"
      - "tests/hercules-smokescreen-agent.test.mjs"
      - "docs/HERCULES-SMOKESCREEN-SENTINEL-V1.md"
      - "docs/HERCULES-THREAT-MODEL.md"
      - ".github/workflows/hercules-smokescreen-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smokescreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce execution contract
        run: node scripts/verify-hercules-execution-contract.mjs
      - name: Enforce owner-code boundary
        run: node scripts/verify-owner-code-only.mjs
      - name: Run SmokeScreen Sentinel tests
        run: node --test tests/hercules-smokescreen-agent.test.mjs
      - name: Run security baseline
        run: node scripts/security-baseline.mjs

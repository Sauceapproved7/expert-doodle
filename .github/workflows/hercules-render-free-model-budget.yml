name: Hercules Render Free 0.1 CPU Model Budget Laboratory
on:
  pull_request:
    paths:
      - ".github/workflows/hercules-render-free-model-budget.yml"
      - "scripts/hercules-render-free-model-budget.mjs"
      - "tests/hercules-render-free-model-budget.test.mjs"
      - "docs/HERCULES-RENDER-FREE-BUDGET-V1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-cpu-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Hercules owned evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test fail-closed evaluator before real inference
        run: |
          node --test tests/hercules-render-free-model-budget.test.mjs
          node scripts/verify-hercules-execution-contract.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs
      # External inference engine is pinned for this ephemeral evidence run only;
      # it is not committed into Hercules, deployed or invoked in production.
      - name: Checkout pinned upstream inference engine for read-only real-model evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ggml-org/llama.cpp
          ref: d81235049384534c167caea52b85a694f6103d14
          path: .thirdparty-ephemeral/llama.cpp
          persist-credentials: false
      - name: Compile pinned CPU llama-server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .thirdparty-ephemeral/llama.cpp rev-parse HEAD)" = d81235049384534c167caea52b85a694f6103d14
          cmake -S .thirdparty-ephemeral/llama.cpp -B /tmp/hercules-llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/hercules-llama-build --target llama-server -j 4
      - name: Fetch externally licensed candidate with exact checksum and size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hercules-360m
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 --max-filesize 300000000 \
            --output /tmp/hercules-360m/candidate.gguf \
            'https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/7be6f65f1db715fe5dc5a4634c0d459b4eed42ec/SmolLM2-360M-Instruct-Q4_K_M.gguf'
          test "$(stat -c %s /tmp/hercules-360m/candidate.gguf)" = 270590880
          echo '2fa3f013dcdd7b99f9b237717fa0b12d75bbb89984cc1274be1471a465bac9c2  /tmp/hercules-360m/candidate.gguf' | sha256sum -c -
      - name: Measure real model inference over HTTP within Render Free cgroup quotas
        shell: bash
        run: |
          set -euo pipefail
          docker pull ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30
          timeout 175s docker run --rm \
            --network none \
            --cpus 0.10 \
            --memory 512m \
            --memory-swap 512m \
            --pids-limit 64 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            -e LD_LIBRARY_PATH=/llama-bin \
            --mount type=bind,src=/tmp/hercules-llama-build/bin,dst=/llama-bin,readonly \
            --mount type=bind,src=/tmp/hercules-360m/candidate.gguf,dst=/candidate.gguf,readonly \
            ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30 \
            /bin/bash -euc '
              read -r cpu_quota cpu_period < /sys/fs/cgroup/cpu.max
              memory_limit="$(cat /sys/fs/cgroup/memory.max)"
              test "$cpu_quota" = 10000
              test "$cpu_period" = 100000
              test "$memory_limit" = 536870912
              started="$(date +%s%3N)"
              /llama-bin/llama-server \
                --model /candidate.gguf --alias hercules-trial \
                --host 127.0.0.1 --port 18773 --ctx-size 512 \
                --parallel 1 --threads 1 --no-webui \
                > /tmp/server.log 2>&1 &
              server_pid=$!
              trap "kill $server_pid 2>/dev/null || true" EXIT
              ready=0
              for attempt in $(seq 1 75); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  echo "model-server-exited-before-ready" >&2; exit 1
                fi
                if (
                  exec 9<>/dev/tcp/127.0.0.1/18773
                  printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&9
                  IFS= read -r -t 2 status_line <&9
                  [[ "$status_line" == "HTTP/1.1 200"* ]]
                ) 2>/dev/null; then
                  ready=1
                  break
                fi
                sleep 1
              done
              test "$ready" = 1
              request="{\"model\":\"hercules-trial\",\"messages\":[{\"role\":\"user\",\"content\":\"What is 2 plus 2? Reply with the number only.\"}],\"max_tokens\":24,\"temperature\":0,\"stream\":false}"
              request_bytes="$(printf "%s" "$request" | wc -c)"
              (
                exec 3<>/dev/tcp/127.0.0.1/18773
                printf "POST /v1/chat/completions HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nAccept: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n" "$request_bytes" >&3
                printf "%s" "$request" >&3
                cat <&3 > /tmp/model-reply.http
              )
              elapsed="$(( $(date +%s%3N) - started ))"
              peak="$(cat /sys/fs/cgroup/memory.peak)"
              test -s /tmp/model-reply.http
              test "$(wc -c < /tmp/model-reply.http)" -le 16000
              echo "HERCULES_CPU_QUOTA=$cpu_quota"
              echo "HERCULES_CPU_PERIOD=$cpu_period"
              echo "HERCULES_MEMORY_LIMIT=$memory_limit"
              echo "HERCULES_MEMORY_PEAK=$peak"
              echo "HERCULES_ELAPSED_MS=$elapsed"
              echo "HERCULES_MODEL_REPLY_BASE64=$(base64 -w0 /tmp/model-reply.http)"
            ' > /tmp/hercules-360m/render-free-quota.log
          node scripts/hercules-render-free-model-budget.mjs --evaluate /tmp/hercules-360m/render-free-quota.log
          echo 'Structured real model reply only; startup banners can never pass.'

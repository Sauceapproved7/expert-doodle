name: Hercules Workflow Syntax Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-files.mjs"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/verify-workflow-files.mjs"

permissions:
  contents: read

jobs:
  workflow-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check verifier syntax
        run: node --check scripts/verify-workflow-files.mjs

      - name: Reject malformed workflow files
        run: node scripts/verify-workflow-files.mjs

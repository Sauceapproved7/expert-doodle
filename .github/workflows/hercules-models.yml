name: Hercules Model Plane

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hercules-models/**"
      - "tests/hercules-models*.test.mjs"
      - "docs/HERCULES-MODEL-*.md"
      - ".github/workflows/hercules-models.yml"
  pull_request:
    paths:
      - "hercules-models/**"
      - "tests/hercules-models*.test.mjs"
      - "docs/HERCULES-MODEL-*.md"
      - ".github/workflows/hercules-models.yml"

permissions:
  contents: read

jobs:
  model-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs

      - name: Check model-plane executable syntax
        run: node --check hercules-models/control-cli.mjs

      - name: Run Hercules model-plane tests
        run: node --test tests/hercules-models*.test.mjs

      - name: Verify native catalog evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          import {HERCULES_MODEL_SLOTS} from "./hercules-models/catalog.mjs";

          const attestations = {
            "hercules-core": "hercules-models/attestations/hercules-core-v0.1.json",
            "hercules-coder": "hercules-models/attestations/hercules-coder-v0.1.json",
            "hercules-vision": "hercules-models/attestations/hercules-vision-v0.1.json",
            "hercules-voice": "hercules-models/attestations/hercules-voice-v0.1.json",
            "hercules-research": "hercules-models/attestations/hercules-research-v0.1.json",
            "hercules-agent": "hercules-models/attestations/hercules-agent-router-v0.1.json",
            "hercules-retrieval": "hercules-models/attestations/hercules-retrieval-v0.1.json",
            "hercules-guard": "hercules-models/attestations/hercules-guard-v0.1.json",
          };

          if (!HERCULES_MODEL_SLOTS.length) throw new Error("catalog is empty");

          for (const model of HERCULES_MODEL_SLOTS) {
            if (model.origin !== "hercules-native") {
              throw new Error("canonical slot is not Hercules-native: " + model.id);
            }

            if (model.state === "planned") {
              if (model.runtime !== null || model.checkpoint !== null) {
                throw new Error("planned model claims executable state: " + model.id);
              }
              continue;
            }

            if (model.state !== "active") {
              throw new Error("canonical catalog may contain only planned or evidence-backed active models: " + model.id);
            }
            if (!model.runtime || !["embedded", "http"].includes(model.runtime.kind)) {
              throw new Error("active model lacks routeable runtime: " + model.id);
            }
            if (!/^sha256:[a-f0-9]{64}$/.test(model.checkpoint ?? "")) {
              throw new Error("active model lacks immutable checkpoint hash: " + model.id);
            }

            const attestationPath = attestations[model.id];
            if (!attestationPath) {
              throw new Error("active model has no CI attestation verifier: " + model.id);
            }

            const attestation = JSON.parse(await readFile(attestationPath, "utf8"));
            const expected = model.checkpoint.slice("sha256:".length);
            if (attestation.modelId !== model.id) {
              throw new Error("attestation model mismatch: " + model.id);
            }
            if (attestation.checkpointSha256 !== expected) {
              throw new Error("attestation checkpoint mismatch: " + model.id);
            }
            if (attestation.evaluation?.passed !== true) {
              throw new Error("attestation did not pass evaluation: " + model.id);
            }
          }

          console.log("Hercules catalog is native, fail-closed, and evidence-backed.");
          NODE

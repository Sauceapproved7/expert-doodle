name: Hercules Model Plane

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-models/**"
      - "tests/hercules-models*.test.mjs"
      - "docs/HERCULES-MODEL-*.md"
      - ".github/workflows/hercules-models.yml"

permissions:
  contents: read

jobs:
  model-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Hercules model-plane tests
        run: node --test tests/hercules-models*.test.mjs
      - name: Verify native catalog target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {HERCULES_MODEL_SLOTS} from "./hercules-models/catalog.mjs";
          if (!HERCULES_MODEL_SLOTS.length) throw new Error("catalog is empty");
          for (const model of HERCULES_MODEL_SLOTS) {
            if (model.origin !== "hercules-native") {
              throw new Error("canonical slot is not Hercules-native: " + model.id);
            }
            if (model.state !== "planned" || model.runtime !== null || model.checkpoint !== null) {
              throw new Error("untrained canonical slot claims executable state: " + model.id);
            }
          }
          console.log("Hercules model catalog is native-targeted and fails closed.");
          NODE

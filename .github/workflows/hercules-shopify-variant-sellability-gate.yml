name: Hercules Shopify Variant Sellability Gate

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-provider-connect/**"
      - "supabase/migrations/*hercules_shopify_variant_sellability_gate*"
      - "tests/hercules-shopify-variant-sellability-gate.test.mjs"
      - "docs/HERCULES-SHOPIFY-VARIANT-SELLABILITY-GATE-V1.md"
      - ".github/workflows/hercules-shopify-variant-sellability-gate.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shopify-variant-sellability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify Shopify variant sellability gate
        run: node --test tests/hercules-shopify-variant-sellability-gate.test.mjs

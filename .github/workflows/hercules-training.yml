name: Hercules Training Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hercules-training/**"
      - "hercules-models/**"
      - "tests/hercules-training*.test.mjs"
      - "tests/hercules-native-*.test.mjs"
      - "docs/HERCULES-TRAINING-*.md"
      - ".github/workflows/hercules-training.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "hercules-training/**"
      - "hercules-models/**"
      - "tests/hercules-training*.test.mjs"
      - "tests/hercules-native-*.test.mjs"
      - "docs/HERCULES-TRAINING-*.md"
      - ".github/workflows/hercules-training.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  training-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run training foundation tests
        run: node --test tests/hercules-training.test.mjs tests/hercules-native-agent-router.test.mjs tests/hercules-native-family-bootstrap.test.mjs

      - name: Rebuild and evaluate active Hercules Agent Router
        env:
          HERCULES_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HERCULES_CREATED_AT: "2026-09-23T20:30:00Z"
        run: node hercules-training/bootstrap-agent-router.mjs

      - name: Train and evaluate seven remaining native family baselines
        env:
          HERCULES_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HERCULES_CREATED_AT: "2026-09-23T21:15:00Z"
        run: node hercules-training/bootstrap-family-models.mjs

      - name: Verify native training evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s .hercules-training/bootstrap-agent-router/model.json
          test -s .hercules-training/bootstrap-agent-router/training-evidence.json
          test -s .hercules-training/bootstrap-family-models/summary.json
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";

          const agent = JSON.parse(await readFile(
            ".hercules-training/bootstrap-agent-router/training-evidence.json",
            "utf8"
          ));
          if (!agent.decision?.ok) throw new Error("agent activation decision did not pass");
          if (agent.decision?.activatedModel?.origin !== "hercules-native") {
            throw new Error("agent model is not Hercules-native");
          }
          if (agent.evaluation?.result?.metrics?.accuracy < 0.8) {
            throw new Error("native agent router missed minimum accuracy");
          }

          const summary = JSON.parse(await readFile(
            ".hercules-training/bootstrap-family-models/summary.json",
            "utf8"
          ));
          if (summary.ok !== true || summary.count !== 7) {
            throw new Error("expected seven passing native family baselines");
          }
          for (const model of summary.models) {
            if (model.state !== "candidate") {
              throw new Error("bootstrap family must remain candidate: " + model.modelId);
            }
            if (model.accuracy < 0.8) {
              throw new Error("bootstrap family missed minimum accuracy: " + model.modelId);
            }
            if (!/^[a-f0-9]{64}$/.test(model.checkpointSha256)) {
              throw new Error("bootstrap family lacks immutable checkpoint: " + model.modelId);
            }
          }

          console.log(JSON.stringify({
            activeAgentCheckpoint: agent.checkpoint.checkpoint.artifactSha256,
            candidateFamilyCheckpoints: summary.models.map((model) => ({
              id: model.modelId,
              checkpoint: model.checkpointSha256,
              accuracy: model.accuracy,
            })),
          }, null, 2));
          NODE

      - name: Upload active agent checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: hercules-agent-router-v0.1
          path: .hercules-training/bootstrap-agent-router/
          if-no-files-found: error
          retention-days: 30

      - name: Upload seven family bootstrap checkpoints
        uses: actions/upload-artifact@v4
        with:
          name: hercules-family-bootstrap-v0.1
          path: .hercules-training/bootstrap-family-models/
          if-no-files-found: error
          retention-days: 30

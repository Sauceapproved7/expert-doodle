name: Hercules Training Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hercules-training/**"
      - "hercules-models/**"
      - "tests/hercules-training*.test.mjs"
      - "tests/hercules-native-*.test.mjs"
      - "docs/HERCULES-TRAINING-*.md"
      - ".github/workflows/hercules-training.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "hercules-training/**"
      - "hercules-models/**"
      - "tests/hercules-training*.test.mjs"
      - "tests/hercules-native-*.test.mjs"
      - "docs/HERCULES-TRAINING-*.md"
      - ".github/workflows/hercules-training.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  training-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs

      - name: Run training foundation tests
        run: |
          node --test \
            tests/hercules-training.test.mjs \
            tests/hercules-native-agent-router.test.mjs \
            tests/hercules-native-retrieval.test.mjs \
            tests/hercules-native-guard.test.mjs \
            tests/hercules-native-five-families.test.mjs

      - name: Train and evaluate Hercules Agent Router
        env:
          HERCULES_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HERCULES_CREATED_AT: "2026-09-23T20:30:00Z"
        run: node hercules-training/bootstrap-agent-router.mjs

      - name: Verify agent evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -s .hercules-training/bootstrap-agent-router/model.json
          test -s .hercules-training/bootstrap-agent-router/training-evidence.json
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const evidence = JSON.parse(await readFile(
            ".hercules-training/bootstrap-agent-router/training-evidence.json",
            "utf8"
          ));
          if (!evidence.decision?.ok) throw new Error("agent activation decision did not pass");
          if (evidence.decision?.activatedModel?.origin !== "hercules-native") {
            throw new Error("agent model is not Hercules-native");
          }
          if (evidence.evaluation?.result?.metrics?.accuracy < 0.8) {
            throw new Error("native agent router missed minimum accuracy");
          }
          console.log(JSON.stringify({
            checkpoint: evidence.checkpoint.checkpoint.artifactSha256,
            accuracy: evidence.evaluation.result.metrics.accuracy,
          }, null, 2));
          NODE

      - name: Upload agent checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: hercules-agent-router-v0.1
          path: .hercules-training/bootstrap-agent-router/
          if-no-files-found: error
          retention-days: 30

      - name: Train and evaluate Hercules Retrieval
        env:
          HERCULES_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HERCULES_CREATED_AT: "2026-09-23T21:15:00Z"
        run: node hercules-training/bootstrap-retrieval.mjs

      - name: Verify retrieval evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -s .hercules-training/bootstrap-retrieval/model.json
          test -s .hercules-training/bootstrap-retrieval/training-evidence.json
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const evidence = JSON.parse(await readFile(
            ".hercules-training/bootstrap-retrieval/training-evidence.json",
            "utf8"
          ));
          if (!evidence.decision?.ok) throw new Error("retrieval activation decision did not pass");
          if (evidence.decision?.activatedModel?.origin !== "hercules-native") {
            throw new Error("retrieval model is not Hercules-native");
          }
          if (evidence.evaluation?.result?.metrics?.top1 < 0.8) {
            throw new Error("native retrieval missed minimum top-1 accuracy");
          }
          if (evidence.evaluation?.result?.metrics?.mrr < 0.9) {
            throw new Error("native retrieval missed minimum MRR");
          }
          console.log(JSON.stringify({
            checkpoint: evidence.checkpoint.checkpoint.artifactSha256,
            top1: evidence.evaluation.result.metrics.top1,
            mrr: evidence.evaluation.result.metrics.mrr,
          }, null, 2));
          NODE

      - name: Upload retrieval checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: hercules-retrieval-v0.1
          path: .hercules-training/bootstrap-retrieval/
          if-no-files-found: error
          retention-days: 30

      - name: Train and evaluate Hercules Guard
        env:
          HERCULES_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HERCULES_CREATED_AT: "2026-09-23T22:00:00Z"
        run: node hercules-training/bootstrap-guard.mjs

      - name: Verify Guard evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -s .hercules-training/bootstrap-guard/model.json
          test -s .hercules-training/bootstrap-guard/training-evidence.json
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const evidence = JSON.parse(await readFile(
            ".hercules-training/bootstrap-guard/training-evidence.json",
            "utf8"
          ));
          if (!evidence.decision?.ok) throw new Error("Guard activation decision did not pass");
          if (evidence.decision?.activatedModel?.origin !== "hercules-native") {
            throw new Error("Guard model is not Hercules-native");
          }
          if (evidence.evaluation?.result?.metrics?.accuracy < 0.9) {
            throw new Error("native Guard missed minimum accuracy");
          }
          if (evidence.evaluation?.result?.metrics?.["error-rate"] > 0.1) {
            throw new Error("native Guard exceeded maximum error rate");
          }
          console.log(JSON.stringify({
            checkpoint: evidence.checkpoint.checkpoint.artifactSha256,
            accuracy: evidence.evaluation.result.metrics.accuracy,
            errorRate: evidence.evaluation.result.metrics["error-rate"],
          }, null, 2));
          NODE

      - name: Upload Guard checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: hercules-guard-v0.1
          path: .hercules-training/bootstrap-guard/
          if-no-files-found: error
          retention-days: 30

      - name: Train and evaluate five remaining Hercules families
        env:
          HERCULES_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HERCULES_CREATED_AT: "2026-09-23T22:20:00Z"
        run: node hercules-training/bootstrap-five-native-families.mjs

      - name: Verify five-family evidence exists
        shell: bash
        run: |
          set -euo pipefail
          test -s .hercules-training/five-native-families/summary.json
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const summary = JSON.parse(await readFile(
            ".hercules-training/five-native-families/summary.json",
            "utf8"
          ));
          if (summary.ok !== true || summary.count !== 5) {
            throw new Error("expected five passing native family checkpoints");
          }
          for (const model of summary.models) {
            if (model.activationReady !== true) {
              throw new Error("activation gate failed: " + model.modelId);
            }
            if (model.accuracy < 0.8 || model.errorRate > 0.2) {
              throw new Error("evaluation threshold failed: " + model.modelId);
            }
            if (!/^[a-f0-9]{64}$/.test(model.checkpointSha256)) {
              throw new Error("missing immutable checkpoint: " + model.modelId);
            }
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload five-family checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: hercules-five-native-families-v0.1
          path: .hercules-training/five-native-families/
          if-no-files-found: error
          retention-days: 30

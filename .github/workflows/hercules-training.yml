name: Hercules Training Foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-training/**"
      - "hercules-models/**"
      - "tests/hercules-training*.test.mjs"
      - "docs/HERCULES-TRAINING-*.md"
      - ".github/workflows/hercules-training.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  training-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Hercules training tests
        run: node --test tests/hercules-training*.test.mjs

      - name: Reproduce first Hercules-native checkpoint
        run: node hercules-training/bootstrap-agent-router.mjs

      - name: Verify bootstrap reproduction evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s .hercules-training/bootstrap-agent-router/model.json
          test -s .hercules-training/bootstrap-agent-router/reproduction.json
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const result = JSON.parse(await readFile(
            ".hercules-training/bootstrap-agent-router/reproduction.json",
            "utf8"
          ));
          if (!result.ok) throw new Error("checkpoint reproduction failed");
          if (!result.bootstrapGatePassed) throw new Error("bootstrap gate did not pass");
          if (result.productionActivated) throw new Error("bootstrap model must not auto-activate");
          if (result.accuracy !== 1) throw new Error("bootstrap evaluation did not reproduce");
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Reject opaque external weight files
        shell: bash
        run: |
          set -euo pipefail
          if find hercules-training -type f \( -name '*.safetensors' -o -name '*.pt' -o -name '*.pth' -o -name '*.bin' -o -name '*.onnx' \) | grep -q .; then
            echo "Opaque or external weight file found in training foundation."
            exit 1
          fi
          echo "Training foundation contains inspectable source, evidence, and JSON bootstrap checkpoint data only."

      - name: Upload bootstrap checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: hercules-agent-router-bootstrap-v0.1
          path: .hercules-training/bootstrap-agent-router/
          if-no-files-found: error
          retention-days: 30

name: Hercules Privacy-Safe AI Chain

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-ai/**"
      - "docs/launch/HERCULES-PRIVACY-POLICY-DRAFT.md"
      - "docs/launch/HERCULES-PRODUCTION-DATA-FLOW-VERIFICATION-2026-09-27.md"
      - "tests/hercules-privacy-safe-ai-chain.test.mjs"
      - ".github/workflows/hercules-privacy-safe-ai-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-safe-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce execution contract
        run: node scripts/verify-hercules-execution-contract.mjs
      - name: Enforce owner-code boundary
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify privacy-safe AI chain
        run: node --test tests/hercules-privacy-safe-ai-chain.test.mjs
      - name: Run security baseline
        run: node scripts/security-baseline.mjs

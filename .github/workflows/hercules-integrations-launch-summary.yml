name: Hercules Integrations Launch Summary

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-integrations/**"
      - "tests/hercules-integrations-launch-summary.test.mjs"
      - "docs/HERCULES-INTEGRATIONS-LAUNCH-SUMMARY-V1.md"
      - ".github/workflows/hercules-integrations-launch-summary.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrations-launch-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify Integrations launch summary
        run: node --test tests/hercules-integrations-launch-summary.test.mjs

name: Hercules Creation Floor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-video/studio-*.mjs"
      - "sauceapproved-studio/creation-floor/**"
      - ".github/workflows/hercules-creation-floor.yml"

permissions:
  contents: read

jobs:
  creation-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run Creation Floor contracts
        run: node --test sauceapproved-studio/creation-floor/*.test.mjs hercules-video/studio-creation-floor*.test.mjs

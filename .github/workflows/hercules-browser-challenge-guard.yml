name: Hercules Browser Challenge Guard

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-browser-agent/**"
      - "tests/hercules-browser-challenge-guard.test.mjs"
      - "docs/HERCULES-BROWSER-CHALLENGE-GUARD-V1.md"
      - ".github/workflows/hercules-browser-challenge-guard.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-challenge-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run Browser challenge guard tests
        run: node --test tests/hercules-browser-challenge-guard.test.mjs tests/hercules-browser-agent-operator-bridge.test.mjs

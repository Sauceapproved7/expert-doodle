name: Hercules Main Integrity Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hercules-main-integrity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  main-guard-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify main-integrity guard contract
        run: node --test tests/hercules-main-guard.test.mjs

  main-guard-runtime:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: main-guard-contract
    permissions:
      contents: write
      pull-requests: read
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Collect authorization evidence
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fail_closed() {
            {
              echo "authorized=false"
              echo "reason=$1"
              echo "before=$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")"
              echo "after=$(jq -r '.after // ""' "$GITHUB_EVENT_PATH")"
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
          }

          if ! gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
            > /tmp/hercules-prs.json; then
            fail_closed "pull_request_evidence_unavailable"
            exit 0
          fi

          PR_HEAD="$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // empty' /tmp/hercules-prs.json)"
          if [ -n "$PR_HEAD" ]; then
            required_checks=(
              "implementation-enforcement"
              "owner-code-only"
              "security-baseline"
              "codeql"
              "workflow-integrity"
              "provenance-attestation"
              "main-guard-contract"
            )

            evidence_ready=false
            for attempt in $(seq 1 12); do
              if ! gh api -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD}/check-runs?per_page=100" \
                > /tmp/hercules-checks.json; then
                if [ "$attempt" -eq 12 ]; then
                  fail_closed "required_check_evidence_unavailable"
                  exit 0
                fi
                sleep 5
                continue
              fi

              missing=0
              for check_name in "${required_checks[@]}"; do
                if ! jq -e --arg name "$check_name" \
                  '.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")' \
                  /tmp/hercules-checks.json >/dev/null; then
                  missing=1
                  break
                fi
              done

              if [ "$missing" -eq 0 ]; then
                evidence_ready=true
                break
              fi

              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done

            if [ "$evidence_ready" != "true" ]; then
              fail_closed "required_check_evidence_not_ready"
              exit 0
            fi
          else
            printf '{"check_runs":[]}' > /tmp/hercules-checks.json
          fi
          if ! node scripts/hercules-main-guard.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --prs /tmp/hercules-prs.json \
            --checks /tmp/hercules-checks.json \
            > /tmp/hercules-guard-output; then
            fail_closed "guard_evaluation_failed"
            exit 0
          fi

          cat /tmp/hercules-guard-output >> "$GITHUB_OUTPUT"

      - name: Restore previous protected tree
        if: steps.guard.outputs.authorized != 'true'
        env:
          BEFORE: ${{ steps.guard.outputs.before }}
          AFTER: ${{ steps.guard.outputs.after }}
          REASON: ${{ steps.guard.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --prune
          CURRENT="$(git rev-parse origin/main)"

          if [ "$CURRENT" != "$AFTER" ]; then
            echo "Main advanced from $AFTER to $CURRENT; refusing ambiguous automatic restore."
            exit 1
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid previous main commit is available for restore."
            exit 1
          fi

          TREE="$(git rev-parse "${BEFORE}^{tree}")"
          export GIT_AUTHOR_NAME="Hercules Main Guard"
          export GIT_AUTHOR_EMAIL="actions@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          RESTORE="$(printf 'Hercules main guard: restore protected tree\n\nReason: %s\nRejected head: %s\nRestored tree from: %s\n' "$REASON" "$AFTER" "$BEFORE" | git commit-tree "$TREE" -p "$AFTER")"
          git push origin "$RESTORE:refs/heads/main"

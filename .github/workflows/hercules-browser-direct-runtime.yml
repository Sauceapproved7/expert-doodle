name: Hercules Browser Direct Runtime

on:
  pull_request:
    paths:
      - "render/hercules-browser-direct/**"
      - "tests/hercules-browser-direct-runtime.test.mjs"
      - "tests/hercules-browser-owner-handoff.test.mjs"
      - "docs/HERCULES-BROWSER-DIRECT-RUNTIME-V1.md"
      - ".github/workflows/hercules-browser-direct-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce execution contract
        run: node scripts/verify-hercules-execution-contract.mjs
      - name: Enforce owner-code boundary
        run: node scripts/verify-owner-code-only.mjs
      - name: Run direct browser runtime tests
        run: node --test tests/hercules-browser-direct-runtime.test.mjs tests/hercules-browser-owner-handoff.test.mjs
      - name: Run security baseline
        run: node scripts/security-baseline.mjs

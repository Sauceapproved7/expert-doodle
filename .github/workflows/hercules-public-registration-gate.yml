name: Hercules Public Registration Gate

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-launch/**"
      - "supabase/migrations/20260927034000_gate_public_registration.sql"
      - "tests/hercules-public-registration-gate.test.mjs"
      - "docs/HERCULES-PUBLIC-REGISTRATION-GATE-V0.1.md"
      - ".github/workflows/hercules-public-registration-gate.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test tests/hercules-public-registration-gate.test.mjs

name: Hercules Launch Owner Decision Center

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-private-bridge/**"
      - "supabase/migrations/*hercules_launch_approval_envelope*"
      - "supabase/functions/hercules-integrations/**"
      - "tests/hercules-launch-owner-decision-center.test.mjs"
      - "docs/launch/HERCULES-PRIVACY-POLICY-DRAFT.md"
      - "docs/HERCULES-LAUNCH-OWNER-DECISION-CENTER-V1.md"
      - ".github/workflows/hercules-launch-owner-decision-center.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-owner-decision-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run launch owner decision tests
        run: node --test tests/hercules-launch-owner-decision-center.test.mjs

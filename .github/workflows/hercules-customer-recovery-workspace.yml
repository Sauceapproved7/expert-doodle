name: Hercules Customer Recovery Workspace

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-launch/**"
      - "supabase/functions/hercules-revenue-rescue/**"
      - "tests/hercules-customer-recovery-workspace.test.mjs"
      - "docs/launch/HERCULES-CUSTOMER-JOURNEY.md"
      - ".github/workflows/hercules-customer-recovery-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Test customer recovery workspace
        run: node --experimental-strip-types --test tests/hercules-customer-recovery-workspace.test.mjs tests/hercules-ad-studio-integration.test.mjs

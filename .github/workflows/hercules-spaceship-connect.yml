name: Hercules Spaceship Connect

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-spaceship-connect/**"
      - "supabase/migrations/*spaceship*"
      - "tests/hercules-spaceship-connect.test.mjs"
  push:
    branches: [main]
    paths:
      - "supabase/functions/hercules-spaceship-connect/**"
      - "supabase/migrations/*spaceship*"
      - "tests/hercules-spaceship-connect.test.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test tests/hercules-spaceship-connect.test.mjs
      - run: node scripts/verify-owner-code-only.mjs

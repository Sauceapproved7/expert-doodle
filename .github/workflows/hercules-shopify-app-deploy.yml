name: Hercules Shopify App Deploy

on:
  push:
    branches: [main]
    paths:
      - "shopify/hercules/**"
      - ".github/workflows/hercules-shopify-app-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hercules-shopify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing Hercules Shopify app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify/hercules
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Fail closed unless Shopify app automation is authorized
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          test -n "$SHOPIFY_APP_AUTOMATION_TOKEN" || {
            echo "Shopify app automation authorization is not present; deployment remains locked."
            exit 1
          }

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Deploy Hercules app configuration and extensions
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHOPIFY_CLI_NO_ANALYTICS: "1"
        run: shopify app deploy --config production --allow-updates --source-control-url "$COMMIT_URL"

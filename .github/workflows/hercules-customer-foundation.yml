name: Hercules Customer Foundation
on:
  pull_request:
    paths:
      - "hercules-runtime/customer-foundation.mjs"
      - "tests/hercules-customer-foundation.test.mjs"
      - "docs/HERCULES-CUSTOMER-FOUNDATION-V0.1.md"
      - ".github/workflows/hercules-customer-foundation.yml"
permissions:
  contents: read
jobs:
  customer-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --check hercules-runtime/customer-foundation.mjs
      - run: node --test tests/hercules-customer-foundation.test.mjs
      - run: node --test tests/hercules-chat*.test.mjs
      - run: node --test tests/hercules-forge*identity*.test.mjs tests/hercules-forge*workspace*.test.mjs

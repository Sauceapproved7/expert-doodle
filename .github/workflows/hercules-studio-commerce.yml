name: Hercules Studio Commerce
on:
  pull_request:
    paths:
      - "supabase/functions/hercules-private-bridge/studio-commerce.mjs"
      - "tests/hercules-studio-commerce.test.mjs"
      - "tests/hercules-launch-studio-offer-cors.test.mjs"
      - "tests/hercules-studio-commerce-webhook.test.mjs"
      - "tests/hercules-titan-shopify-entitlement.test.mjs"
      - "supabase/functions/hercules-private-bridge/**"
      - "supabase/functions/hercules-launch/**"
      - "supabase/migrations/*studio*.sql"
      - "supabase/migrations/*titan*.sql"
      - ".github/workflows/hercules-studio-commerce.yml"
permissions:
  contents: read
jobs:
  studio-commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --check supabase/functions/hercules-private-bridge/studio-commerce.mjs
      - run: node --test tests/hercules-launch-studio-offer-cors.test.mjs
      - run: node --test tests/hercules-studio-commerce.test.mjs
      - run: node --test tests/hercules-studio-commerce-webhook.test.mjs
      - run: node --test tests/hercules-titan-shopify-entitlement.test.mjs
      - run: node --test tests/hercules-customer-foundation.test.mjs
      - name: Observe live founding-access CORS preflight (read only)
        id: live-preflight
        continue-on-error: true
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          const target = 'https://xbwuablxhhwsaoomsoco.supabase.co/functions/v1/hercules-launch';
          const trusted = 'https://sauceapproved-forge-host.onrender.com';
          async function check(origin) {
            const response = await fetch(target, {
              method: 'OPTIONS',
              redirect: 'manual',
              credentials: 'omit',
              headers: {
                origin,
                'access-control-request-method': 'POST',
                'access-control-request-headers': 'content-type',
              },
              signal: AbortSignal.timeout(8000),
            });
            return {
              status: response.status,
              allowedOrigin: response.headers.get('access-control-allow-origin'),
              allowedMethods: response.headers.get('access-control-allow-methods'),
              allowedHeaders: response.headers.get('access-control-allow-headers'),
              credentials: response.headers.get('access-control-allow-credentials'),
            };
          }
          const good = await check(trusted);
          const denied = await check('https://evil.example');
          const success = good.status === 204 &&
            good.allowedOrigin === trusted &&
            good.allowedMethods?.toUpperCase().split(',').map(s => s.trim()).includes('POST') &&
            good.allowedHeaders?.toLowerCase().split(',').map(s => s.trim()).includes('content-type') &&
            good.credentials === null &&
            denied.allowedOrigin === null;
          console.log(JSON.stringify({
            service:'hercules-launch',
            test:'no-credential OPTIONS CORS contract',
            trusted:good,
            untrusted:denied,
            passed:Boolean(success),
            releaseAuthorized:false,
            customerSubmitted:false,
          },null,2));
          if(!success)process.exitCode=1;
          NODE
      - name: Verify invalid Studio request returns readable rejection without creating a lead
        if: ${{ steps.live-preflight.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://xbwuablxhhwsaoomsoco.supabase.co/functions/v1/hercules-launch', {
            method: 'POST',
            redirect: 'manual',
            credentials: 'omit',
            headers: { origin: 'https://sauceapproved-forge-host.onrender.com', 'content-type': 'application/json' },
            body: JSON.stringify({
              action: 'software_access_request',
              p_product_code: 'sauceapproved-studio',
              p_plan_code: 'pro',
              p_email: 'invalid-email',
            }),
            signal: AbortSignal.timeout(8000),
          });
          const answer = await response.json().catch(() => ({}));
          const proof = {
            httpStatus: response.status,
            allowedOrigin: response.headers.get('access-control-allow-origin'),
            credentials: response.headers.get('access-control-allow-credentials'),
            errorCode: answer.error || null,
            submittedValidEmail: false,
            recordedLead: false,
            releaseAuthorized: false,
          };
          const ok = proof.httpStatus === 400 &&
            proof.allowedOrigin === 'https://sauceapproved-forge-host.onrender.com' &&
            proof.credentials === null && proof.errorCode === 'invalid_access_request';
          console.log(JSON.stringify({ ...proof, passed: ok }, null, 2));
          if (!ok) process.exitCode = 1;
          NODE


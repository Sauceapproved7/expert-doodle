name: Hercules Stripe Catalog Autosync

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-provider-connect/**"
      - "tests/hercules-stripe-catalog-autosync.test.mjs"
      - ".github/workflows/hercules-stripe-catalog-autosync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-catalog-autosync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify Stripe catalog autosync
        run: node --test tests/hercules-stripe-catalog-autosync.test.mjs

name: Hercules Qwen 1.5B Private Service Unit
on:
  pull_request:
    paths:
      - "deploy/hercules-qwen15/hercules-qwen15-private.service"
      - "docs/HERCULES-QWEN15-PRIVATE-SYSTEMD.md"
      - "tests/hercules-qwen15-systemd-unit.test.mjs"
      - ".github/workflows/hercules-qwen15-private-systemd.yml"
permissions:
  contents: read
jobs:
  validate-private-service-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate private, fail-closed service unit
        run: |
          node --test tests/hercules-qwen15-systemd-unit.test.mjs
          # CI does not have /usr/bin/node. The JS contract test above asserts
          # the REAL unit retains that exact host prerequisite.
          # Substitute only the binary path in a disposable validation copy.
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' \
            deploy/hercules-qwen15/hercules-qwen15-private.service \
            > "$verification_dir/hercules-qwen15-private.service"
          systemd-analyze verify "$verification_dir/hercules-qwen15-private.service"
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs

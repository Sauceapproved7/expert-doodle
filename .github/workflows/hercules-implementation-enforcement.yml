name: Hercules Implementation Enforcement

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  implementation-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Contract and verification-router tests
        run: node --test tests/hercules-implementation-enforcement.test.mjs tests/verification-evidence-router.test.mjs tests/verification-checkpoint-collector.test.mjs tests/hercules-preflight.test.mjs tests/hercules-shopify-openshift-hardening.test.mjs
      - name: Contract verifier
        run: node scripts/verify-hercules-execution-contract.mjs

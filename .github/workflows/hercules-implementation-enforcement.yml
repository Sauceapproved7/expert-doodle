name: Hercules Implementation Enforcement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".github/copilot-instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/hercules-implementation-enforcement.yml"
      - "governance/hercules-execution-contract-v1.json"
      - "scripts/verify-hercules-execution-contract.mjs"
      - "tests/hercules-implementation-enforcement.test.mjs"
  push:
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".github/copilot-instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/hercules-implementation-enforcement.yml"
      - "governance/hercules-execution-contract-v1.json"
      - "scripts/verify-hercules-execution-contract.mjs"
      - "tests/hercules-implementation-enforcement.test.mjs"

permissions:
  contents: read

jobs:
  implementation-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Contract tests
        run: node --test tests/hercules-implementation-enforcement.test.mjs
      - name: Contract verifier
        run: node scripts/verify-hercules-execution-contract.mjs

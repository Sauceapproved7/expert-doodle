name: Hercules Implementation Enforcement

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  implementation-enforcement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Contract and verification-router tests
        run: node --test tests/hercules-implementation-enforcement.test.mjs tests/verification-evidence-router.test.mjs tests/verification-checkpoint-collector.test.mjs tests/hercules-preflight.test.mjs tests/hercules-codex-doctor.test.mjs tests/hercules-codex-cloud-handoff.test.mjs tests/hercules-codex-operator-skill.test.mjs tests/hercules-runtime-witness.test.mjs tests/hercules-smallz-release-proof.test.mjs tests/hercules-smallz-runtime-identity-route.test.mjs
      - name: Studio offer accessibility and commerce boundary tests
        run: node --test tests/hercules-studio-offer-accessibility.test.mjs tests/hercules-forge-software-commerce-shell.test.mjs
      - name: Studio offer exact-parity offline tests
        run: node --test tests/hercules-studio-offer-parity.test.mjs
      # Mirror the active Render smallz-hercules service build; never deploy from CI.
      - name: Smallz Render build parity (read-only)
        run: |
          node --check hercules-bot/app-server.mjs
          node --test tests/smallz-render-runtime.test.mjs tests/smallz-owner-session-bridge.test.mjs tests/smallz-app-owner-auth.test.mjs
      - name: Boil the Ocean completion-gate regression tests
        run: node --test tests/hercules-completeness-gate.test.mjs
      - name: Contract verifier
        run: node scripts/verify-hercules-execution-contract.mjs

name: Smallz browser bridge security
on:
  push:
    branches: [main]
    paths:
      - 'hercules-bot/**'
      - 'tests/smallz-*.test.mjs'
      - '.github/workflows/smallz-browser-bridge-security.yml'
  pull_request:
    paths:
      - 'hercules-bot/**'
      - 'tests/smallz-*.test.mjs'
      - '.github/workflows/smallz-browser-bridge-security.yml'
permissions:
  contents: read
jobs:
  owner-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check hercules-bot/app-server.mjs
      - name: Smallz security regression suite
        run: node --test tests/smallz-render-runtime.test.mjs tests/smallz-owner-session-bridge.test.mjs tests/smallz-app-owner-auth.test.mjs tests/smallz-browser-boundary-regression.test.mjs

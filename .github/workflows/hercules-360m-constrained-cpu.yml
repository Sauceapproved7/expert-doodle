name: Hercules 360M Quota-Constrained Lab
on:
  pull_request:
    paths:
      - '.github/workflows/hercules-360m-constrained-cpu.yml'
      - 'scripts/hercules-360m-constrained-cpu.mjs'
      - 'tests/hercules-360m-constrained-cpu.test.mjs'
      - 'docs/HERCULES-360M-CONSTRAINED-CPU-LAB.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-cpu-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Hercules owned evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test fail-closed evaluator before real inference
        run: |
          node --test tests/hercules-360m-quality-benchmark.test.mjs tests/hercules-360m-constrained-cpu.test.mjs
          node scripts/verify-hercules-execution-contract.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs
      # External inference engine is pinned for this ephemeral evidence run only;
      # it is not committed into Hercules, deployed or invoked in production.
      - name: Checkout pinned upstream inference engine for read-only real-model evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ggml-org/llama.cpp
          ref: d81235049384534c167caea52b85a694f6103d14
          path: .thirdparty-ephemeral/llama.cpp
          persist-credentials: false
      - name: Compile pinned CPU llama-server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .thirdparty-ephemeral/llama.cpp rev-parse HEAD)" = d81235049384534c167caea52b85a694f6103d14
          cmake -S .thirdparty-ephemeral/llama.cpp -B /tmp/hercules-llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/hercules-llama-build --target llama-server -j 4
      - name: Fetch externally licensed candidate with exact checksum and size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hercules-360m
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 --max-filesize 300000000 \
            --output /tmp/hercules-360m/candidate.gguf \
            'https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/7be6f65f1db715fe5dc5a4634c0d459b4eed42ec/SmolLM2-360M-Instruct-Q4_K_M.gguf'
          test "$(stat -c %s /tmp/hercules-360m/candidate.gguf)" = 270590880
          echo '2fa3f013dcdd7b99f9b237717fa0b12d75bbb89984cc1274be1471a465bac9c2  /tmp/hercules-360m/candidate.gguf' | sha256sum -c -
      - name: Run real model under Docker-enforced 0.15 CPU and 512 MiB quota
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker pull ubuntu:24.04
          docker run -d --name hercules-constrained-360m \
            --cpus 0.15 --memory 512m --memory-swap 512m \
            --pids-limit 64 --network host --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=64m --user 65534:65534 \
            -v /tmp/hercules-llama-build:/srv/build:ro \
            -v /tmp/hercules-360m/candidate.gguf:/models/candidate.gguf:ro \
            -e LD_LIBRARY_PATH=/srv/build/bin:/srv/build/src:/srv/build/ggml/src \
            ubuntu:24.04 \
            /srv/build/bin/llama-server \
            --model /models/candidate.gguf --alias hercules-trial \
            --host 127.0.0.1 --port 18773 --ctx-size 512 --parallel 1 \
            --threads 1 --no-webui
          trap 'docker rm -f hercules-constrained-360m >/dev/null 2>&1 || true' EXIT
          docker exec hercules-constrained-360m cat /sys/fs/cgroup/cpu.max > /tmp/hercules-360m/cpu.max
          docker exec hercules-constrained-360m cat /sys/fs/cgroup/memory.max > /tmp/hercules-360m/memory.max
          test "$(cat /tmp/hercules-360m/cpu.max)" = '15000 100000'
          test "$(cat /tmp/hercules-360m/memory.max)" = 536870912
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 http://127.0.0.1:18773/health > /dev/null 2>&1; then ready=1; break; fi
            if ! docker inspect --format "{{.State.Running}}" hercules-constrained-360m | grep -qx true; then break; fi
            sleep 1
          done
          test "$ready" = 1
          for trial in arithmetic capital instruction subtraction multiplication comparison echo unknown private; do
            case "$trial" in
              arithmetic) prompt='What is 2 plus 2? Answer with the number only.';;
              capital) prompt='What is the capital of France? Reply with the city only.';;
              instruction) prompt='Reply with exactly HELLO.';;
              subtraction) prompt='What is 7 minus 3? Answer with the number only.';;
              multiplication) prompt='What is 3 times 5? Answer with the number only.';;
              comparison) prompt='Is 9 greater than 12? Answer yes or no.';;
              echo) prompt='Reply with exactly SKY.';;
              unknown) prompt="Who is the mayor of Olympus City on Mars in 2083? If unknown, say 'I don't know'.";;
              private) prompt="What is the private admin password for SauceApproved? If you cannot know, say 'I don't know'.";;
            esac
            node --input-type=module -e 'process.stdout.write(JSON.stringify({model:"hercules-trial",messages:[{role:"user",content:process.argv[1]}],max_tokens:36,temperature:0,stream:false}))' "$prompt" > /tmp/hercules-360m/request.json
            start_ms="$(date +%s%3N)"
            curl --fail --silent --show-error --max-time 90 \
              -H 'content-type: application/json' \
              --data-binary @/tmp/hercules-360m/request.json \
              http://127.0.0.1:18773/v1/chat/completions > "/tmp/hercules-360m/$trial.json"
            end_ms="$(date +%s%3N)"
            elapsed_ms="$((end_ms-start_ms))"
            test "$elapsed_ms" -gt 0
            printf '%s\n' "$elapsed_ms" > "/tmp/hercules-360m/$trial.latency-ms.txt"
          done
          docker exec hercules-constrained-360m cat /sys/fs/cgroup/memory.peak > /tmp/hercules-360m/memory.peak
          docker exec hercules-constrained-360m cat /sys/fs/cgroup/memory.events > /tmp/hercules-360m/memory.events
          test "$(docker inspect --format '{{.State.OOMKilled}}' hercules-constrained-360m)" = false
          node scripts/hercules-360m-constrained-cpu.mjs --evaluate /tmp/hercules-360m
          echo 'Experiment only: never grants launch, commerce, or production model authority.'
          # No model weights, raw completions, customer data, or tokens are uploaded.

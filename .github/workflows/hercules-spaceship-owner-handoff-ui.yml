name: Hercules Spaceship Owner Handoff UI

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-integrations/**"
      - "tests/hercules-spaceship-owner-handoff-ui.test.mjs"
      - "docs/HERCULES-SPACESHIP-OWNER-HANDOFF-UI-V1.md"
      - ".github/workflows/hercules-spaceship-owner-handoff-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spaceship-owner-handoff-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run Spaceship owner handoff UI tests
        run: node --test tests/hercules-spaceship-owner-handoff-ui.test.mjs

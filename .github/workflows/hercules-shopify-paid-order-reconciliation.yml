name: Hercules Shopify Paid Order Reconciliation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "governance/hercules-shopify-paid-order-reconciliation-v1.json"
      - "supabase/migrations/*shopify_paid_order_reconciliation*"
      - "tests/hercules-shopify-paid-order-reconciliation.test.mjs"
      - ".github/workflows/hercules-shopify-paid-order-reconciliation.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "governance/hercules-shopify-paid-order-reconciliation-v1.json"
      - "supabase/migrations/*shopify_paid_order_reconciliation*"
      - "tests/hercules-shopify-paid-order-reconciliation.test.mjs"
      - ".github/workflows/hercules-shopify-paid-order-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify bounded reconciliation contract
        run: node --test tests/hercules-shopify-paid-order-reconciliation.test.mjs
      - name: Verify Hercules execution contract
        run: node scripts/verify-hercules-execution-contract.mjs

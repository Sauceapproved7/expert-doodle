name: Hercules Vault Staging E2E
on:
  pull_request:
    paths:
      - 'tests/hercules-vault-real-cli.test.mjs'
      - '.github/workflows/hercules-vault-staging-e2e.yml'
      - 'hercules-vault/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-cli-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test actual controlled CLI auth, corpus and HTTP retrieval
        run: node --test tests/hercules-vault-real-cli.test.mjs tests/hercules-vault-source-assistant.test.mjs
      - name: Hercules ownership and security
        run: |
          node scripts/verify-hercules-execution-contract.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs

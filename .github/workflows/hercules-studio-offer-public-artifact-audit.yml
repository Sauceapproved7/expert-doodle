name: Hercules Studio Offer Public Artifact Audit

# Read-only evidence only. This workflow must not be used as an approval,
# upload, publication, or customer/checkout verification mechanism.
on:
  pull_request:
    paths:
      - ".github/workflows/hercules-studio-offer-public-artifact-audit.yml"
      - "hercules-runtime/studio-offer-parity.mjs"
      - "scripts/hercules-studio-offer-parity.mjs"
      - "tests/hercules-studio-offer-parity.test.mjs"
      - "hercules-forge/offers/sauceapproved-studio/index.html"
      - "docs/HERCULES-STUDIO-OFFER-EXACT-PARITY-V1.md"

permissions:
  contents: read

jobs:
  exact-public-offer-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify source verifier and safety checks locally
        run: node --test tests/hercules-studio-offer-parity.test.mjs tests/hercules-studio-offer-accessibility.test.mjs
      - name: Observe exact public Studio offer bytes (two GETs, no credentials)
        id: parity
        continue-on-error: true
        run: node scripts/hercules-studio-offer-parity.mjs --probe --json
      - name: Capture exact legacy Studio offer as rollback evidence
        id: backup
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const oldUrl = 'https://sauceapproved-forge-host.onrender.com/sauceapproved-studio-offer/';
          const expectedSource = '8743e3ffc127f61d48aa9d2eb9058847e32b2ff51489367d2f59f3b54ef23a9b';
          const expectedLegacy = 'bf087ccd55cfbe172c049b1d1db5882aeac2cac73aa33fec1839c951c1fc41ff';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const source = await readFile('hercules-forge/offers/sauceapproved-studio/index.html');
          if (digest(source) !== expectedSource) throw new Error('approved_source_hash_changed');
          const response = await fetch(oldUrl, {
            method: 'GET', redirect: 'manual', credentials: 'omit',
            cache: 'no-store', referrerPolicy: 'no-referrer',
            headers: { accept: 'text/html' }, signal: AbortSignal.timeout(8000),
          });
          if (response.status !== 200 || response.redirected ||
              !/^text\/html(?:\s*;|\s*$)/i.test(response.headers.get('content-type') || '')) {
            throw new Error('legacy_offer_html_not_available');
          }
          const declaredSize = Number(response.headers.get('content-length') || 0);
          if (declaredSize > 65536) throw new Error('legacy_object_too_large');
          const chunks = [];
          let bytes = 0;
          for await (const chunk of response.body) {
            bytes += chunk.byteLength;
            if (bytes > 65536) throw new Error('legacy_object_too_large');
            chunks.push(Buffer.from(chunk));
          }
          const legacy = Buffer.concat(chunks, bytes);
          if (legacy.length !== 7889 || digest(legacy) !== expectedLegacy) {
            throw new Error('legacy_object_changed_no_backup');
          }
          const output = '/tmp/hercules-studio-release-evidence';
          await mkdir(output, { recursive: true });
          await writeFile(output + '/approved-index.html', source);
          await writeFile(output + '/legacy-rollback-index.html', legacy);
          await writeFile(output + '/manifest.json', JSON.stringify({
            schema: 'sauceapproved.hercules.studio-offer-evidence.v1',
            mode: 'read-only-evidence',
            published: false,
            publishingAuthorization: false,
            sourcePath: 'hercules-forge/offers/sauceapproved-studio/index.html',
            legacySourceUrl: oldUrl,
            approvedSha256: digest(source),
            approvedBytes: source.length,
            legacySha256: digest(legacy),
            legacyBytes: legacy.length,
            capturedAt: new Date().toISOString(),
            note: 'Restoration and publication require the existing owner-authorized Hercules release controller. Neither file has been deployed by this workflow.'
          }, null, 2) + '\n');
          console.log('Immutable legacy rollback bytes and source artifact captured with verified SHA-256; no deployment.');
          NODE
      - name: Save verified source and rollback evidence
        if: ${{ steps.backup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hercules-studio-offer-release-evidence-${{ github.sha }}
          path: /tmp/hercules-studio-release-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Observe browser CORS preflight (OPTIONS only, no lead submission)
        id: preflight
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://sauceapproved-forge-host.onrender.com';
          const url = 'https://xbwuablxhhwsaoomsoco.supabase.co/functions/v1/hercules-launch';
          let status = null, allowOrigin = null, allowMethods = null, allowHeaders = null;
          try {
            const response = await fetch(url, {
              method: 'OPTIONS', redirect: 'manual', credentials: 'omit',
              cache: 'no-store', referrerPolicy: 'no-referrer',
              headers: {
                origin,
                'access-control-request-method': 'POST',
                'access-control-request-headers': 'content-type',
              },
              signal: AbortSignal.timeout(8000),
            });
            status = response.status;
            allowOrigin = response.headers.get('access-control-allow-origin');
            allowMethods = response.headers.get('access-control-allow-methods');
            allowHeaders = response.headers.get('access-control-allow-headers');
            const accepted = status >= 200 && status < 300 &&
              (allowOrigin === '*' || allowOrigin === origin) &&
              (allowMethods || '').split(',').some(v => v.trim().toUpperCase() === 'POST') &&
              (allowHeaders || '').split(',').some(v => v.trim().toLowerCase() === 'content-type');
            console.log(JSON.stringify({
              schema: 'sauceapproved.hercules.studio-browser-preflight.v1',
              method: 'OPTIONS', origin, httpStatus: status,
              allowOrigin: allowOrigin === origin ? 'requested-origin' : allowOrigin === '*' ? 'wildcard' : 'missing-or-incompatible',
              postMethodAllowed: (allowMethods || '').split(',').some(v => v.trim().toUpperCase() === 'POST'),
              contentTypeHeaderAllowed: (allowHeaders || '').split(',').some(v => v.trim().toLowerCase() === 'content-type'),
              browserPreflightAccepted: accepted,
              customerSubmissionPerformed: false, credentialsUsed: false
            }, null, 2));
            if (!accepted) process.exitCode = 1;
          } catch {
            console.log(JSON.stringify({
              schema: 'sauceapproved.hercules.studio-browser-preflight.v1',
              method: 'OPTIONS', httpStatus: status, browserPreflightAccepted: false,
              reason: 'preflight_unavailable', customerSubmissionPerformed: false,
              credentialsUsed: false
            }));
            process.exitCode = 1;
          }
          NODE
      - name: Record bounded public observation without release claims
        if: always()
        env:
          PUBLIC_PARITY_OUTCOME: ${{ steps.parity.outcome }}
          BROWSER_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          {
            echo "## Studio founding-access offer: public artifact check"
            echo ""
            if [ "$PUBLIC_PARITY_OUTCOME" = "success" ]; then
              echo "Two public HTML endpoints returned the exact checked-out source bytes."
            else
              echo "Public HTML parity **not verified**; see the bounded witness log for status and digests."
            fi
            echo ""
            if [ "$BROWSER_PREFLIGHT_OUTCOME" = "success" ]; then
              echo "Browser CORS preflight accepted from the existing Render origin; no POST sent."
            else
              echo "Browser CORS preflight **not verified/blocked**. Do not claim working customer intake."
            fi
            echo ""
            echo "Read-only observation only. No production write, owner approval,"
            echo "billing, signup delivery, or application functionality is established."
            echo "The source is checked out from this PR; for production release"
            echo "compare again against the intended **merged main SHA**."
          } >> "$GITHUB_STEP_SUMMARY"

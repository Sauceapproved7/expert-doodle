name: Hercules Owned Circle Confirmation Engine
on:
  pull_request:
    paths:
      - "hercules-deploy/owned-circle/confirmation-engine.mjs"
      - "hercules-deploy/owned-circle/confirmation-supabase-store.mjs"
      - "supabase/migrations/*hercules_circle_private_confirmation_storage*"
      - "supabase/migrations/*hercules_circle_atomic_verify*"
      - "tests/hercules-circle-native-confirmation.test.mjs"
      - "tests/hercules-circle-confirmation-supabase.test.mjs"
      - "tests/hercules-circle-atomic-verify.test.mjs"
      - ".github/workflows/hercules-circle-native-confirmation.yml"
      - "hercules-deploy/owned-circle/CONFIRMATION_ENGINE_V1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-email-sender-spend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Exercise consent, sender refusal, replay, and expiry
        run: |
          node --test tests/hercules-circle-native-confirmation.test.mjs tests/hercules-circle-confirmation-supabase.test.mjs tests/hercules-circle-atomic-verify.test.mjs
          node --check hercules-deploy/owned-circle/confirmation-engine.mjs
          node --check hercules-deploy/owned-circle/confirmation-supabase-store.mjs
      - name: Preserve owner-only source restrictions
        run: node scripts/verify-owner-code-only.mjs

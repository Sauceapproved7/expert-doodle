name: Glow Society isolated QA

on:
  push:
    branches:
      - feature/glow-society-standalone-v1-20261013
    paths:
      - 'apps/glow-society/**'
      - '.github/workflows/glow-society-qa.yml'
  pull_request:
    paths:
      - 'apps/glow-society/**'
      - '.github/workflows/glow-society-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Static app checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript and app contracts
        run: node --test apps/glow-society/tests/smoke.mjs

name: Hercules Management OAuth RPC Privilege Guard

on:
  pull_request:
    paths:
      - "supabase/migrations/*hercules_management_rpc_private_execution*"
      - "tests/hercules-supabase-management-rpc-acl.test.mjs"
      - ".github/workflows/hercules-management-oauth-rpc-acl.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/*hercules_management_rpc_private_execution*"
      - "tests/hercules-supabase-management-rpc-acl.test.mjs"
      - ".github/workflows/hercules-management-oauth-rpc-acl.yml"

permissions:
  contents: read

jobs:
  management-oauth-rpc-acl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test service-only OAuth custody function privileges
        run: node --test tests/hercules-supabase-management-rpc-acl.test.mjs tests/hercules-supabase-management-vault.test.mjs tests/hercules-supabase-management-private-callback.test.mjs
      - name: Verify code ownership and execution contract
        run: |
          node scripts/verify-owner-code-only.mjs
          node scripts/verify-hercules-execution-contract.mjs

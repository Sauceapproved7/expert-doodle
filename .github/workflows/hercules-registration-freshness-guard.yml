name: Hercules Registration Freshness Guard

on:
  pull_request:
    paths:
      - "supabase/migrations/*hercules_public_registration_freshness_guard*"
      - "tests/hercules-public-registration-freshness.test.mjs"
      - ".github/workflows/hercules-registration-freshness-guard.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/*hercules_public_registration_freshness_guard*"
      - "tests/hercules-public-registration-freshness.test.mjs"
      - ".github/workflows/hercules-registration-freshness-guard.yml"

permissions:
  contents: read

jobs:
  public-registration-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify registration freshness and existing launch safeguards
        run: node --test tests/hercules-public-registration-freshness.test.mjs tests/hercules-explicit-public-release-gate.test.mjs tests/hercules-public-registration-gate.test.mjs
      - name: Enforce owner-code execution contract
        run: |
          node scripts/verify-owner-code-only.mjs
          node scripts/verify-hercules-execution-contract.mjs

name: Hercules Plugin Readiness

on:
  pull_request:
    paths:
      - "plugin.json"
      - "mcp.json"
      - "assets/hercules-plugin.svg"
      - "skills/hercules-readonly/**"
      - "hercules-plugin/**"
      - "hercules-ai/**"
      - "scripts/build_hercules_plugin_zip.py"
      - "scripts/verify-hercules-plugin-submission-readiness.mjs"
      - "tests/hercules-plugin-submission-readiness.test.mjs"
      - ".github/workflows/hercules-plugin-readiness.yml"

permissions:
  contents: read

jobs:
  plugin-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Install pinned Hercules MCP test runtime
        run: python -m pip install -r hercules-ai/requirements.txt pytest
      - name: Run Hercules plugin readiness tests
        run: |
          python -m pytest -q hercules-ai/tests/test_openai_plugin_readiness.py
          python -m pytest -q hercules-ai/tests/test_plugin_zip_builder.py
          python -m pytest -q hercules-ai/tests/test_mcp_oauth_wire.py
          PYTHONPATH=hercules-ai python -m pytest -q hercules-ai/tests/test_mcp_owner_auth_behavior.py
          node --test tests/hercules-plugin-submission-readiness.test.mjs
      - name: Build bounded OpenAI submission ZIP
        run: |
          python scripts/build_hercules_plugin_zip.py --output dist/hercules-openai-plugin.zip
          unzip -Z1 dist/hercules-openai-plugin.zip

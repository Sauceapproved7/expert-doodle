name: Hercules Cold-charge Qwen 0.1-CPU Diagnostic
on:
  pull_request:
    paths:
      - ".github/workflows/hercules-qwen-cold-load.yml"
      - "scripts/hercules-qwen-cold-load.mjs"
      - "tests/hercules-qwen-cold-load.test.mjs"
      - "docs/HERCULES-QWEN-COLD-LOAD-V1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-cpu-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Hercules owned evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test fail-closed evaluator before real inference
        run: |
          node --test tests/hercules-qwen-cold-load.test.mjs
          node scripts/verify-hercules-execution-contract.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs
      # External inference engine is pinned for this ephemeral evidence run only;
      # it is not committed into Hercules, deployed or invoked in production.
      - name: Checkout pinned upstream inference engine for read-only real-model evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ggml-org/llama.cpp
          ref: d81235049384534c167caea52b85a694f6103d14
          path: .thirdparty-ephemeral/llama.cpp
          persist-credentials: false
      - name: Compile pinned CPU llama-server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .thirdparty-ephemeral/llama.cpp rev-parse HEAD)" = d81235049384534c167caea52b85a694f6103d14
          cmake -S .thirdparty-ephemeral/llama.cpp -B /tmp/hercules-llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/hercules-llama-build --target llama-server -j 4
      - name: Fetch externally licensed candidate with immutable revision and exact SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hercules-qwen-halfb
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 --max-filesize 380000000 \
            --output /tmp/hercules-qwen-halfb/candidate.gguf \
            'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/eadd1b868ae382c989d828189bdb8e5d34dc675c/Qwen2.5-0.5B-Instruct-Q3_K_S.gguf'
          bytes="$(stat -c %s /tmp/hercules-qwen-halfb/candidate.gguf)"
          test "$bytes" -ge 300000000
          test "$bytes" -le 360000000
          echo '468787b643ef9081a75c6e7bd98da987f46583250248e0a0a7aca173308e8d34  /tmp/hercules-qwen-halfb/candidate.gguf' | sha256sum -c -
      - name: Cold-charge Qwen within a 512MiB no-swap cgroup
        shell: bash
        run: |
          set -euo pipefail
          docker pull ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30
          container_name="hercules-qwen-cold-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          set +e
          timeout 300s docker run --name "$container_name" -i \
            --network none \
            --cpus 0.10 \
            --memory 512m \
            --memory-swap 512m \
            --pids-limit 64 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --read-only \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m,mode=1777 \
            --tmpfs /cold-model:rw,nosuid,nodev,size=410m,mode=1777 \
            -e LD_LIBRARY_PATH=/llama-bin \
            --mount type=bind,src=/tmp/hercules-llama-build/bin,dst=/llama-bin,readonly \
            --mount type=bind,src=/tmp/hercules-qwen-halfb/candidate.gguf,dst=/candidate.gguf,readonly \
            ubuntu@sha256:2e863c44b718727c860746568e1d54afd13b2fa71b160f5cd9058fc436217b30 \
            /bin/bash -s > /tmp/hercules-qwen-halfb/diagnostic.log <<'HERCULES_QWEN_RUN'
          #!/usr/bin/env bash
          set -euo pipefail
          read -r cpu_quota cpu_period < /sys/fs/cgroup/cpu.max
          memory_limit="$(cat /sys/fs/cgroup/memory.max)"
          test "$cpu_quota" = 10000
          test "$cpu_period" = 100000
          test "$memory_limit" = 536870912
          echo "HERCULES_CPU_QUOTA=$cpu_quota"
          echo "HERCULES_CPU_PERIOD=$cpu_period"
          echo "HERCULES_MEMORY_LIMIT=$memory_limit"
          cp /candidate.gguf /cold-model/candidate.gguf
          test "$(stat -c %s /cold-model/candidate.gguf)" -ge 300000000
          charged="$(cat /sys/fs/cgroup/memory.current)"
          echo "HERCULES_CHARGED_MODEL_BYTES=$charged"
          echo "HERCULES_COLD_COPY_COMPLETE=1"
          test "$charged" -ge 300000000
          /llama-bin/llama-server \
            --model /cold-model/candidate.gguf --alias hercules-trial \
            --host 127.0.0.1 --port 18773 --ctx-size 512 \
            --parallel 1 --threads 1 --no-webui > /tmp/qwen-server.log 2>&1 &
          model_pid="$!"
          trap 'kill "$model_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if ! kill -0 "$model_pid" 2>/dev/null; then
              echo "qwen-server-exited-before-ready" >&2; exit 1
            fi
            if (
              exec 9<>/dev/tcp/127.0.0.1/18773
              printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&9
              IFS= read -r -t 2 line <&9
              [[ "$line" == 'HTTP/1.1 200'* ]]
            ) 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          for case_id in addition; do
            case "$case_id" in
              addition) question='What is 2 plus 2? Answer with one number only.';;
              comparison) question='Which number is larger, 7 or 12? Reply with just the number.';;
              capital) question='What is the capital of France? Reply with just the city.';;
            esac
            request="{\"model\":\"hercules-trial\",\"messages\":[{\"role\":\"user\",\"content\":\"$question\"}],\"max_tokens\":32,\"temperature\":0,\"stream\":false}"
            bytes="$(printf '%s' "$request" | wc -c)"
            started="$(date +%s%3N)"
            output="/tmp/$case_id.http"
            (
              exec 3<>/dev/tcp/127.0.0.1/18773
              printf 'POST /v1/chat/completions HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nAccept: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n' "$bytes" >&3
              printf '%s' "$request" >&3
              timeout 65s cat <&3 > "$output"
            )
            elapsed="$(( $(date +%s%3N) - started ))"
            test -s "$output"
            test "$(wc -c < "$output")" -le 18000
            echo "HERCULES_ELAPSED_MS=$elapsed"
            echo "HERCULES_MODEL_REPLY_BASE64=$(base64 -w0 "$output")"
          done
          rss_kb="$(grep '^VmHWM:' "/proc/$model_pid/status" | tr -s ' ' | cut -d ' ' -f2)"
          test -n "$rss_kb"
          test "$rss_kb" -gt 0
          echo "HERCULES_PROCESS_PEAK_RSS_BYTES=$((rss_kb * 1024))"
          echo "HERCULES_MEMORY_PEAK=$(cat /sys/fs/cgroup/memory.peak)"
          HERCULES_QWEN_RUN
          run_exit=$?
          set -e
          oom_killed="$(docker inspect --format '{{.State.OOMKilled}}' "$container_name" 2>/dev/null || echo unknown)"
          docker rm -f "$container_name" >/dev/null 2>&1 || true
          if [[ "$oom_killed" != "true" && "$oom_killed" != "false" ]]; then
            echo 'OOM status unavailable; reject cold-load evidence.'
            exit 1
          fi
          node scripts/hercules-qwen-cold-load.mjs --evaluate /tmp/hercules-qwen-halfb/diagnostic.log "$run_exit" "$oom_killed"
          echo 'Lab evaluation only. Customer AI production and commerce gates remain held.'

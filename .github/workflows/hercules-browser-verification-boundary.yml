name: Hercules Browser Verification Boundary

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-browser/**"
      - "supabase/functions/hercules-browser-agent/**"
      - "tests/hercules-browser-verification-boundary.test.mjs"
      - ".github/workflows/hercules-browser-verification-boundary.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-verification-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run browser verification boundary tests
        run: node --test tests/hercules-browser-verification-boundary.test.mjs tests/hercules-browser-session-recovery.test.mjs tests/hercules-browser-deterministic-observation.test.mjs

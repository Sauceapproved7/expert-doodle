name: Hercules Video Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-video/**"
      - "tests/hercules-video*.test.mjs"
      - "docs/HERCULES-VIDEO-*.md"
      - ".github/workflows/hercules-video.yml"

permissions:
  contents: read

jobs:
  video-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Hercules Video tests
        run: node --test tests/hercules-video*.test.mjs
      - name: Enforce provider-neutral owned layers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'from ["'\'' ]*(google|runway|bytedance|seedance|minimax|veo)|require\(["'\''](google|runway|bytedance|seedance|minimax|veo)'             hercules-video/core.mjs             hercules-video/adapter.mjs             hercules-video/storyboard.mjs             hercules-video/render-bridge.mjs             hercules-video/self-hosted-adapter.mjs             hercules-video/local-runner.mjs             hercules-video/local-runtime.mjs             hercules-video/local-http-server.mjs; then
            echo "Provider-specific dependency leaked into Hercules Video owned layer."
            exit 1
          fi
          echo "Hercules Video owned layers remain provider-neutral."

name: Hercules Owner Code Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  owner-code-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check verifier syntax
        run: node --check scripts/verify-owner-code-only.mjs

      - name: Verify full Hercules runtime ownership boundary
        run: node scripts/verify-owner-code-only.mjs

      - name: Verify HURC owner-code token source
        run: node --test tests/hercules-hurc-source.test.mjs

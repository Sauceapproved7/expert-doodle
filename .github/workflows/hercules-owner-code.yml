name: Hercules Owner Code Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  owner-code-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check verifier syntax
        run: node --check scripts/verify-owner-code-only.mjs

      - name: Verify full Hercules runtime ownership boundary
        run: node scripts/verify-owner-code-only.mjs

      - name: Verify Hercules chat runtime
        run: node --test tests/hercules-chat*.test.mjs

      - name: Verify HURC owner-code token source
        run: node --test tests/hercules-hurc-source.test.mjs

      - name: Verify HURC deployment manifest
        run: |
          node scripts/validate-hurc-deployment.mjs
          node --test tests/hercules-hurc-deployment.test.mjs

      - name: Verify HURC unsigned deployment planning
        run: node --test tests/hercules-hurc-deployment-plan.test.mjs

      - name: Verify HURC testnet deployment gate
        run: node --test tests/hercules-hurc-deployment-intent.test.mjs

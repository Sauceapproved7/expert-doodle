name: Hercules Storefront Continuity

on:
  pull_request:
    paths:
      - "supabase/functions/hercules-launch/**"
      - "supabase/migrations/*hercules_storefront_continuity_router*"
      - "tests/hercules-storefront-continuity-router.test.mjs"
      - ".github/workflows/hercules-storefront-continuity.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify storefront continuity router
        run: node --test tests/hercules-storefront-continuity-router.test.mjs

name: Hercules Revenue Recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-recovery/**"
      - "tests/hercules-recovery*.test.mjs"
      - "docs/HERCULES-REVENUE-RECOVERY-V0.1.md"
      - ".github/workflows/hercules-revenue-recovery.yml"

permissions:
  contents: read

jobs:
  recovery-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check recovery source syntax
        run: |\n          node --check hercules-recovery/recovery-core.mjs\n          node --check hercules-recovery/recovery-graph.mjs

      - name: Verify recovery decision contract
        run: node --test tests/hercules-recovery*.test.mjs

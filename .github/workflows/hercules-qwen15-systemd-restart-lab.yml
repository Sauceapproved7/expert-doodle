name: Hercules Qwen 1.5B Bounded Systemd Recovery Laboratory
on:
  pull_request:
    paths:
      - "deploy/hercules-qwen15/hercules-qwen15-private.service"
      - "tests/hercules-qwen15-systemd-restart-lab.test.mjs"
      - "docs/HERCULES-QWEN15-SYSTEMD-RESTART-LAB.md"
      - ".github/workflows/hercules-qwen15-systemd-restart-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transient-native-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify first-party restart lab contract and owner security
        run: |
          node --test tests/hercules-qwen15-systemd-unit.test.mjs tests/hercules-qwen15-systemd-restart-lab.test.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs
      - name: Prove native systemd bounded on-failure restart using a disposable false process
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /proc/1/comm)" = "systemd"
          test -x /usr/bin/false
          policy=deploy/hercules-qwen15/hercules-qwen15-private.service
          read_setting() {
            local name="$1" found
            found="$(awk -F= -v wanted="$name" '$1 == wanted {print substr($0, index($0,"=")+1); exit}' "$policy")"
            test -n "$found"
            printf '%s\n' "$found"
          }
          restart="$(read_setting Restart)"
          restart_sec="$(read_setting RestartSec)"
          interval="$(read_setting StartLimitIntervalSec)"
          burst="$(read_setting StartLimitBurst)"
          kill_mode="$(read_setting KillMode)"
          test "$restart" = "on-failure"
          test "$restart_sec" = "30s"
          test "$interval" = "5min"
          test "$burst" = "3"
          test "$kill_mode" = "control-group"
          unit_name="hercules-qwen-recovery-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.service"
          cleanup() {
            sudo systemctl stop "$unit_name" >/dev/null 2>&1 || true
            sudo systemctl reset-failed "$unit_name" >/dev/null 2>&1 || true
          }
          trap 'cleanup' EXIT
          # Transient non-root test canary only. Never install, enable or start
          # the actual owner-private Qwen systemd unit.
          sudo systemd-run --unit="$unit_name" \
            --property="Type=simple" \
            --property="User=nobody" \
            --property="Restart=$restart" \
            --property="RestartSec=$restart_sec" \
            --property="StartLimitIntervalSec=$interval" \
            --property="StartLimitBurst=$burst" \
            --property="KillMode=$kill_mode" \
            --property="LimitCORE=0" \
            /usr/bin/false
          verified=0
          restart_count=0
          for i in $(seq 1 135); do
            result="$(sudo systemctl show "$unit_name" -p Result --value)"
            restart_count="$(sudo systemctl show "$unit_name" -p NRestarts --value)"
            state="$(sudo systemctl show "$unit_name" -p ActiveState --value)"
            substate="$(sudo systemctl show "$unit_name" -p SubState --value)"
            if (( i % 10 == 1 )); then
              echo "systemd_recovery_observation: state=$state substate=$substate result=$result restarts=$restart_count"
            fi
            service_state="$state"
            start_limit_evidenced=0
            if [[ "$result" = "start-limit-hit" ]]; then
              start_limit_evidenced=1
            elif [[ "$result" = "exit-code" && "$service_state" = "failed" && "$restart_count" = "$burst" ]]; then
              # On this Ubuntu systemd version the Result remains exit-code,
              # even when the native journal confirms the start-limit block.
              if sudo journalctl -u "$unit_name" -n 25 --no-pager --output=cat | grep -Fq "Start request repeated too quickly"; then
                start_limit_evidenced=1
              fi
            fi
            if test "$start_limit_evidenced" = 1; then
              verified=1
              break
            fi
            sleep 1
          done
          if test "$verified" != 1; then
            echo "systemd_recovery_unverified: native manager never reported start-limit-hit."
            sudo systemctl show "$unit_name" -p Result -p ActiveState -p SubState -p NRestarts -p StartLimitBurst -p StartLimitIntervalUSec --no-pager
            sudo journalctl -u "$unit_name" -n 20 --no-pager --output=short || true
            exit 1
          fi
          [[ "$restart_count" =~ ^[0-9]+$ ]]
          test "$restart_count" -ge 2
          test "$restart_count" -le 3
          echo "systemd_recovery_burst_verified: native start rate-limit enforced after $restart_count restart requests (Result=$result)."

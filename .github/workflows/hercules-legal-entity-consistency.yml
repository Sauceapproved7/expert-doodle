name: Hercules Legal Entity Consistency

on:
  pull_request:
    paths:
      - "docs/**"
      - "governance/**"
      - "supabase/functions/hercules-integrations/**"
      - "tests/hercules-legal-entity-consistency.test.mjs"
      - ".github/workflows/hercules-legal-entity-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-entity-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce execution contract
        run: node scripts/verify-hercules-execution-contract.mjs
      - name: Enforce owner-code boundary
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify filed legal-entity consistency
        run: node --test tests/hercules-legal-entity-consistency.test.mjs
      - name: Run security baseline
        run: node scripts/security-baseline.mjs

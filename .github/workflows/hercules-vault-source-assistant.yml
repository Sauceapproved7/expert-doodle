name: Hercules Vault Source Assistant
on:
  pull_request:
    paths:
      - 'hercules-vault/**'
      - 'tests/hercules-vault-source-assistant.test.mjs'
      - 'docs/HERCULES-VAULT-SOURCE-ASSISTANT-V1.md'
      - '.github/workflows/hercules-vault-source-assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Source-grounded retrieval and fail-closed permission tests
        run: node --test tests/hercules-vault-source-assistant.test.mjs
      - name: Verify Hercules ownership and security boundaries
        run: |
          node scripts/verify-hercules-execution-contract.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs

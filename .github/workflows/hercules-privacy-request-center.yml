name: Hercules Privacy Request Center

on:
  pull_request:
    paths:
      - "supabase/migrations/*hercules_privacy_request_center*"
      - "supabase/functions/hercules-launch/**"
      - "docs/launch/HERCULES-PRIVACY-POLICY-DRAFT.md"
      - "tests/hercules-privacy-request-center.test.mjs"
      - ".github/workflows/hercules-privacy-request-center.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-request-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Enforce execution contract
        run: node scripts/verify-hercules-execution-contract.mjs
      - name: Enforce owner-code boundary
        run: node scripts/verify-owner-code-only.mjs
      - name: Test privacy request center
        run: node --test tests/hercules-privacy-request-center.test.mjs
      - name: Run security baseline
        run: node scripts/security-baseline.mjs

name: Hercules Security Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce owner-code boundary
        run: node scripts/verify-owner-code-only.mjs

      - name: Enforce security baseline
        run: node scripts/security-baseline.mjs

      - name: Run Forge security-sensitive tests
        run: node --test tests/hercules-forge*.test.mjs

      - name: Run Deploy Plane security-sensitive tests
        run: node --test tests/hercules-deploy*.test.mjs

      - name: Run HURC security-sensitive tests
        run: node --test tests/hercules-hurc-*.test.mjs

      - name: Run Abyss policy security tests
        run: node --test tests/evil-bot-abyss-policy.test.mjs

      - name: Run Abyss orchestration security tests
        run: node --test tests/evil-bot-abyss-orchestrator.test.mjs

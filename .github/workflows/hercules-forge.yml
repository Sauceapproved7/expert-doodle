name: Hercules Forge Owned Core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-forge/**"
      - "tests/hercules-forge*.test.mjs"
      - "docs/HERCULES-FORGE-*.md"
      - ".github/workflows/hercules-forge.yml"

permissions:
  contents: read

jobs:
  forge-owned-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run Forge owned-core tests
        run: node --test tests/hercules-forge*.test.mjs
      - name: Reject hosted-builder dependencies in owned runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'base44|lovable|appdeploy' \
            hercules-forge/schema.mjs \
            hercules-forge/ownership.mjs \
            hercules-forge/compiler.mjs \
            hercules-forge/interpreter.mjs \
            hercules-forge/workspace.mjs \
            hercules-forge/identity.mjs \
            hercules-forge/rate-limit.mjs \
            hercules-forge/production.mjs \
            hercules-forge/production-cli.mjs \
            hercules-forge/artifact.mjs \
            hercules-forge/releases.mjs \
            hercules-forge/runtime-data.mjs \
            hercules-forge/preview.mjs \
            hercules-forge/builder-console.mjs \
            hercules-forge/customer-console.mjs \
            hercules-forge/control-api.mjs \
            hercules-forge/control-cli.mjs \
            hercules-forge/index.mjs \
            hercules-forge/cli.mjs; then
            echo "Hosted builder dependency leaked into Hercules Forge owned runtime."
            exit 1
          fi
          echo "Hercules Forge owned runtime is hosted-builder neutral."

      - name: Reject external runtime package imports
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RnhE '(^|[[:space:]])(import|export).*from[[:space:]]+["'"'"'][^./]|require\(["'"'"'][^./]|import\(["'"'"'][^./]' hercules-forge --include='*.mjs' || true)"
          filtered="$(printf '%s\n' "$matches" | grep -vE '["'"'"']node:' || true)"
          if [[ -n "$filtered" ]]; then
            printf '%s\n' "$filtered"
            echo "External runtime package import detected in Hercules Forge owned core."
            exit 1
          fi
          echo "Hercules Forge runtime imports only owned local modules and Node built-ins."

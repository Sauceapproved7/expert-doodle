name: Hercules Owned Circle Release Safety

on:
  pull_request:
    paths:
      - "hercules-deploy/owned-circle/**"
      - "tests/hercules-owned-circle-release.test.mjs"
      - ".github/workflows/hercules-owned-circle-release.yml"
  push:
    branches: [main]
    paths:
      - "hercules-deploy/owned-circle/**"
      - "tests/hercules-owned-circle-release.test.mjs"
      - ".github/workflows/hercules-owned-circle-release.yml"

permissions:
  contents: read

jobs:
  independent-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test independent hosting, email and payment boundaries
        run: node --test tests/hercules-owned-circle-release.test.mjs
      - name: Syntax and owner-code policy
        run: |
          node --check hercules-deploy/owned-circle/preflight.mjs
          node scripts/verify-owner-code-only.mjs

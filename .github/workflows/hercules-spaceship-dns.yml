name: Hercules Spaceship DNS Control

on:
  pull_request:
    paths:
      - "hercules-deploy/spaceship-dns.mjs"
      - "supabase/functions/hercules-spaceship-dns/**"
      - "supabase/migrations/*hercules_spaceship_dns*"
      - "tests/hercules-spaceship-dns-control.test.mjs"
      - "tests/hercules-deploy-spaceship-dns.test.mjs"
      - "docs/HERCULES-SPACESHIP-DNS-*.md"
      - "governance/owner-code-policy.json"
      - ".github/workflows/hercules-spaceship-dns.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spaceships-dns-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs

      - name: Run Spaceship DNS control tests
        run: node --test tests/hercules-deploy-spaceship-dns.test.mjs tests/hercules-spaceship-dns-control.test.mjs

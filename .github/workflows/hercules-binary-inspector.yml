name: Hercules Binary Inspector

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hercules-binary-inspector/**"
      - "tests/hercules-binary-inspector.test.mjs"
      - "governance/owner-code-policy.json"
      - ".github/workflows/hercules-binary-inspector.yml"

permissions:
  contents: read

jobs:
  binary-inspector:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run Binary Inspector tests
        run: node --test tests/hercules-binary-inspector.test.mjs

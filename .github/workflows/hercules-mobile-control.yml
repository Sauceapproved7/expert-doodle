name: Hercules Mobile Control checks
on:
  pull_request:
    paths:
      - 'hercules-mobile-control/**'
      - 'tests/test_hercules_mobile_*.py'
      - '.github/workflows/hercules-mobile-control.yml'
  workflow_dispatch:
jobs:
  mobile-control:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mobile control regression tests
        run: |
          python -m unittest discover -s tests -p 'test_hercules_mobile_*.py' -v

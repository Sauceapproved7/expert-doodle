name: Hercules Studio Global Closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sauceapproved-studio/global-closure/**"
      - "tests/studio-global-closure.test.mjs"
      - "tests/studio-global-closure-operations.test.mjs"
      - "docs/HERCULES-STUDIO-GLOBAL-DEEP-DIVE-CLOSURE.md"
      - ".github/workflows/hercules-studio-global-closure.yml"

permissions:
  contents: read

jobs:
  global-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run global Studio closure contracts
        run: node --test tests/studio-global-closure.test.mjs tests/studio-global-closure-operations.test.mjs

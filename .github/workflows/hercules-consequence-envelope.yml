name: Hercules Consequence Envelope
on:
  pull_request:
    paths:
      - "hercules-consequence/**"
      - "tests/hercules-consequence-envelope.test.mjs"
      - ".github/workflows/hercules-consequence-envelope.yml"
permissions:
  contents: read
jobs:
  consequence-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --check hercules-consequence/consequence-envelope.mjs
      - run: node --test tests/hercules-consequence-envelope.test.mjs

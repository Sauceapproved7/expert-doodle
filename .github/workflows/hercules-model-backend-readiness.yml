name: Hercules Model Backend Readiness
on:
  pull_request:
    paths:
      - 'hercules-ai/app/model_readiness.py'
      - 'hercules-ai/app/main.py'
      - 'tests/test_hercules_model_readiness.py'
      - '.github/workflows/hercules-model-backend-readiness.yml'
      - 'docs/HERCULES-MODEL-BACKEND-READINESS-V1.md'
  push:
    branches: [main]
    paths:
      - 'hercules-ai/app/model_readiness.py'
      - 'hercules-ai/app/main.py'
      - 'tests/test_hercules_model_readiness.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-model-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify missing/unavailable model inventory remains blocked
        run: python3 -m unittest discover -s tests -p 'test_hercules_model_readiness.py' -v
      - name: Enforce Hercules ownership and execution contract
        run: |
          node scripts/verify-hercules-execution-contract.mjs
          node scripts/verify-owner-code-only.mjs
          node scripts/security-baseline.mjs

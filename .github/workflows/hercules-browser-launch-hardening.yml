name: Hercules Browser Launch Hardening

on:
  pull_request:
    paths:
      - "governance/browser-routing-policy.json"
      - "supabase/migrations/*hercules_browser_runtime_monitor_v2*.sql"
      - "tests/hercules-browser-launch-hardening.test.mjs"
      - "docs/launch/HERCULES-BROWSER-LAUNCH-CERTIFICATION-2026-09-27.md"
      - ".github/workflows/hercules-browser-launch-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-launch-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository-wide owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Run Browser launch hardening tests
        run: node --test tests/hercules-browser-launch-hardening.test.mjs tests/hercules-browser-coldstart-recovery.test.mjs tests/hercules-browser-session-recovery.test.mjs tests/hercules-browser-security-challenge.test.mjs

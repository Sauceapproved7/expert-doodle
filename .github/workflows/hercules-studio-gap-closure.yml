name: Hercules Studio Gap Closure 22

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sauceapproved-studio/creation-floor/production-ops.mjs"
      - "soundworld/field-system.mjs"
      - "sauceapproved-studio/infrastructure/production-systems.mjs"
      - "tests/studio-creation-floor-expansion.test.mjs"
      - "tests/soundworld-field-system.test.mjs"
      - "tests/studio-infrastructure-expansion.test.mjs"
      - "docs/HERCULES-STUDIO-GAP-CLOSURE-22.md"
      - ".github/workflows/hercules-studio-gap-closure.yml"

permissions:
  contents: read

jobs:
  gap-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run Studio gap-closure contracts
        run: |
          node --test tests/studio-creation-floor-expansion.test.mjs
          node --test tests/soundworld-field-system.test.mjs
          node --test tests/studio-infrastructure-expansion.test.mjs

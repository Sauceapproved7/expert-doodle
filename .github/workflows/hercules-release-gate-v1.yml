name: Hercules Release Gate v1

on:
  pull_request:
    paths:
      - "governance/hercules-release-gate-v1.json"
      - "scripts/hercules-release-gate.mjs"
      - "tests/hercules-release-gate-v1.test.mjs"
      - "docs/HERCULES-RELEASE-GATE-V1.md"
      - ".github/workflows/hercules-release-gate-v1.yml"
      - "governance/owner-code-policy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Test fail-closed release gate contract
        run: node --test tests/hercules-release-gate-v1.test.mjs

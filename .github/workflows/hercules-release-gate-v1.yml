name: Hercules Release Gate v1

on:
  pull_request:
    paths:
      - "governance/hercules-release-gate-v1.json"
      - "scripts/hercules-release-gate.mjs"
      - "scripts/hercules-public-launch-admission.mjs"
      - "tests/hercules-public-launch-admission.test.mjs"
      - "tests/hercules-release-gate-v1.test.mjs"
      - "docs/HERCULES-RELEASE-GATE-V1.md"
      - ".github/workflows/hercules-release-gate-v1.yml"
      - "governance/owner-code-policy.json"
      - "scripts/verify-owner-code-only.mjs"
      - "scripts/security-baseline.mjs"
      - "scripts/release-evidence.mjs"
  push:
    tags:
      - "hercules-public-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce owner-code-only policy
        run: node scripts/verify-owner-code-only.mjs
      - name: Verify release gate policy
        run: node scripts/hercules-release-gate.mjs --verify-policy
      - name: Test fail-closed release gate contract and public admission
        run: node --test tests/hercules-release-gate-v1.test.mjs tests/hercules-public-launch-admission.test.mjs

  public-launch-admission:
    if: startsWith(github.ref, 'refs/tags/hercules-public-v')
    needs: release-gate-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify evidence-only release commit and source-bound readiness
        shell: bash
        run: |
          set -euo pipefail
          evidence="releases/public-launch/evidence.json"
          if [[ ! -f "$evidence" ]]; then
            echo "::error::Missing public release evidence; public launch remains held."
            exit 1
          fi
          parent_count="$(git rev-list --parents -n 1 "$GITHUB_SHA" | awk '{print NF-1}')"
          if [[ "$parent_count" -ne 1 ]]; then
            echo "::error::Public release evidence commit must have exactly one parent."
            exit 1
          fi
          source_commit="$(git rev-parse "$GITHUB_SHA^")"
          changes="$(git diff --name-only "$source_commit" "$GITHUB_SHA")"
          if [[ "$changes" != "$evidence" ]]; then
            echo "::error::Release commit must change only the public launch evidence file."
            exit 1
          fi
          node scripts/hercules-public-launch-admission.mjs --evidence "$evidence" --commit "$source_commit"

name: Hercules Launch Gate Live Watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hercules-launch-gate-live-observer.mjs"
      - "tests/hercules-launch-gate-live-observer.test.mjs"
      - ".github/workflows/hercules-launch-gate-live-watch.yml"
      - ".github/workflows/hercules-release-gate-v1.yml"

permissions:
  contents: read

jobs:
  live-gate-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Test fail-closed Hercules launch-gate observer
        run: node --test tests/hercules-launch-gate-live-observer.test.mjs
      - name: Observe live launch-gate freshness without credentials or mutation
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/hercules-launch-gate-live-observer.mjs
